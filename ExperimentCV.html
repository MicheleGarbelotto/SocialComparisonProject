        async runMainTaskTrial(trialContext) {
          const mainTaskSectionType = "main_task_trial_" + trialContext.trial_number;
          this.currentSectionType = mainTaskSectionType;
          const tracker = createSectionTracker(mainTaskSectionType);
          const rows = [];
          const wheelModel = this.createWheelModel(trialContext);
          const sampleLines = [];
          const trialUsedNames = new Set();
          let sampleCount = 0;
          let eventIndex = 1;
          let pendingJCounter = 0;
          let lastSampleShownAt = null;
          let lastSampleReadyAt = null;
          let cooldownActive = false;
          let cooldownCancelled = false;
          let selectedOutcomeInfo = null;

          this.render(this.buildTaskLayout({ pageTitle: "", showTutorialPanel: false }));
          this.setStartingAmountDisplay(trialContext.domain);
          this.setOutcomeDisplay("__dots__", false);
          this.renderSamplingList(sampleLines);
          this.setSamplingControlState({ jText: "J = See participants' outcomes", jReady: true, fText: "F = Next roulette", fReady: true });
          this.updateActionStrip([{ label: "SPACE = Spin", ready: true }]);

          const canvas = this.query("#roulette-canvas");
          this.drawWheel(canvas, wheelModel, this.currentWheelAngle);
          const readyTimestamp = performance.now();

          const spinAction = await new Promise((resolve) => {
            this.setKeyHandler((event) => {
              if (event.code === CONFIG.keys.spin.code) {
                const rtSpin = Math.round(performance.now() - readyTimestamp);
                this.clearActiveKeyHandler();
                resolve({ rtSpin: rtSpin });
              } else {
                this.invalidKeypressCount += 1;
              }
            });
          });

          selectedOutcomeInfo = this.chooseRouletteOutcome(wheelModel);
          const spinRow = this.createTaskBaseRow(mainTaskSectionType, trialContext, {
            action_type: "spin",
            event_index_within_trial: eventIndex,
            roulette_outcome: selectedOutcomeInfo.selectedOutcome,
            roulette_outcome_not_received: selectedOutcomeInfo.otherOutcome,
            roulette_red: wheelModel.red_outcome,
            roulette_black: wheelModel.black_outcome,
            rt_spin: spinAction.rtSpin
          });
          rows.push(spinRow);

          const firstPostSpinWatcher = this.createFirstPostSpinWatcher();
          this.updateActionStrip([{ label: "Wheel spinning...", muted: true }]);
          await this.animateSpin(canvas, wheelModel, selectedOutcomeInfo.targetIndex);
          this.setOutcomeDisplay(selectedOutcomeInfo.selectedOutcome, false);
          this.updateActionStrip([{ label: "SPACE = Spin", ready: true }]);
          const spinFinishedAt = performance.now();
          firstPostSpinWatcher.markSpinComplete();
          firstPostSpinWatcher.setAllowed({ sample: true, next: true });

          let cooldownHandle = { stop: null };
          const startCooldownAnimation = () => {
            cooldownActive = true;
            cooldownCancelled = false;
            const startedAt = performance.now();
            const animate = () => {
              if (cooldownCancelled) {
                return;
              }
              const progress = clamp((performance.now() - startedAt) / CONFIG.timings.sample_cooldown_ms, 0, 1);
              this.setSamplingControlState({
                jText: "J = See participants' outcomes",
                jCooldown: progress < 1,
                jReady: progress >= 1,
                jProgress: progress,
                fText: "F = Next roulette",
                fReady: true
              });
              if (progress < 1) {
                window.requestAnimationFrame(animate);
              } else {
                cooldownActive = false;
              }
            };
            window.requestAnimationFrame(animate);
            cooldownHandle.stop = () => {
              cooldownCancelled = true;
              cooldownActive = false;
              this.setSamplingControlState({
                jText: "J = See participants' outcomes",
                jCooldown: false,
                jReady: true,
                jProgress: 0,
                fText: "F = Next roulette",
                fReady: true
              });
            };
          };

          const firstAction = await firstPostSpinWatcher.promise;
          spinRow.click_counter_roulette_change_during_spin = firstAction.counters.roulette_change;
          spinRow.click_counter_sample_during_spin = firstAction.counters.sample;
          spinRow.click_counter_spin_during_spin = firstAction.counters.spin;

          if (firstAction.type === "sample") {
            sampleCount = 1;
            eventIndex = 2;
            const firstSampleData = this.sampleOtherParticipant(trialContext, trialUsedNames);
            const firstSampleCounters = this.getNextMainTaskSampleCounters(trialContext.domain);
            sampleLines.push(firstSampleData.display_line);
            this.renderSamplingList(sampleLines);
            const firstShownAt = performance.now();
            rows.push(this.createTaskBaseRow(mainTaskSectionType, trialContext, {
              action_type: "sample",
              event_index_within_trial: eventIndex,
              roulette_outcome: selectedOutcomeInfo.selectedOutcome,
              roulette_outcome_not_received: selectedOutcomeInfo.otherOutcome,
              roulette_red: wheelModel.red_outcome,
              roulette_black: wheelModel.black_outcome,
              rt_sample_from_outcome: Math.round(firstAction.keyTime - spinFinishedAt),
              rt_sample_from_sample: "",
              click_counter_sample_from_sample_to_sample: "",
              sample_index_within_trial: sampleCount,
              sample_index_total: firstSampleCounters.sample_index_total,
              sample_index_loss: firstSampleCounters.sample_index_loss,
              sample_index_gain: firstSampleCounters.sample_index_gain,
              sampled_name: firstSampleData.sampled_name,
              sampled_name_sex: firstSampleData.sampled_name_sex,
              sampled_name_rank: firstSampleData.sampled_name_rank,
              sampled_roulette_outcome: firstSampleData.sampled_roulette_outcome,
              sampled_earnings: firstSampleData.sampled_earnings
            }));
            lastSampleShownAt = firstShownAt;
            lastSampleReadyAt = firstShownAt + CONFIG.timings.sample_cooldown_ms;
            pendingJCounter = 0;
            startCooldownAnimation();
          } else {
            eventIndex = 2;
            const changeRow = this.createTaskBaseRow(mainTaskSectionType, trialContext, {
              action_type: "roulette_change",
              event_index_within_trial: eventIndex,
              roulette_outcome: selectedOutcomeInfo.selectedOutcome,
              roulette_outcome_not_received: selectedOutcomeInfo.otherOutcome,
              roulette_red: wheelModel.red_outcome,
              roulette_black: wheelModel.black_outcome,
              rt_roulette_change_from_outcome: Math.round(firstAction.keyTime - spinFinishedAt),
              rt_roulette_change_from_sample: ""
            });
            changeRow.click_counter_spin_from_roulette_change_to_spin = await this.playWhiteFlash(CONFIG.keys.spin.code);
            rows.push(changeRow);
            const trackerResult = tracker.end();
            this.fillSectionOutcome(rows, trackerResult);
            return {
              rows: rows,
              summary: {
                domain: trialContext.domain,
                received_outcome: selectedOutcomeInfo.selectedOutcome,
                not_received_outcome: selectedOutcomeInfo.otherOutcome,
                roulette_red: wheelModel.red_outcome,
                roulette_black: wheelModel.black_outcome,
                start_with_black: wheelModel.start_with_black
              }
            };
          }

          let trialEnded = false;
          while (!trialEnded) {
            const action = await new Promise((resolve) => {
              this.setKeyHandler((event) => {
                if (event.code === CONFIG.keys.sample.code) {
                  if (cooldownActive) {
                    pendingJCounter += 1;
                    this.invalidKeypressCount += 1;
                    return;
                  }
                  this.clearActiveKeyHandler();
                  resolve({ type: "sample", timestamp: performance.now(), betweenCount: pendingJCounter });
                  return;
                }
                if (event.code === CONFIG.keys.next.code) {
                  this.clearActiveKeyHandler();
                  resolve({ type: "roulette_change", timestamp: performance.now() });
                  return;
                }
                this.invalidKeypressCount += 1;
              });
            });

            if (action.type === "sample") {
              sampleCount += 1;
              eventIndex += 1;
              const sampleData = this.sampleOtherParticipant(trialContext, trialUsedNames);
              const sampleCounters = this.getNextMainTaskSampleCounters(trialContext.domain);
              sampleLines.push(sampleData.display_line);
              this.renderSamplingList(sampleLines);
              const shownAt = performance.now();
              rows.push(this.createTaskBaseRow(mainTaskSectionType, trialContext, {
                action_type: "sample",
                event_index_within_trial: eventIndex,
                roulette_outcome: selectedOutcomeInfo.selectedOutcome,
                roulette_outcome_not_received: selectedOutcomeInfo.otherOutcome,
                roulette_red: wheelModel.red_outcome,
                roulette_black: wheelModel.black_outcome,
                rt_sample_from_outcome: "",
                rt_sample_from_sample: Math.round(action.timestamp - lastSampleReadyAt),
                click_counter_sample_from_sample_to_sample: action.betweenCount,
                sample_index_within_trial: sampleCount,
                sample_index_total: sampleCounters.sample_index_total,
                sample_index_loss: sampleCounters.sample_index_loss,
                sample_index_gain: sampleCounters.sample_index_gain,
                sampled_name: sampleData.sampled_name,
                sampled_name_sex: sampleData.sampled_name_sex,
                sampled_name_rank: sampleData.sampled_name_rank,
                sampled_roulette_outcome: sampleData.sampled_roulette_outcome,
                sampled_earnings: sampleData.sampled_earnings
              }));
              lastSampleShownAt = shownAt;
              lastSampleReadyAt = shownAt + CONFIG.timings.sample_cooldown_ms;
              pendingJCounter = 0;
              startCooldownAnimation();
              continue;
            }

            eventIndex += 1;
            if (cooldownHandle.stop) {
              cooldownHandle.stop();
            }
            const changeRow = this.createTaskBaseRow(mainTaskSectionType, trialContext, {
              action_type: "roulette_change",
              event_index_within_trial: eventIndex,
              roulette_outcome: selectedOutcomeInfo.selectedOutcome,
              roulette_outcome_not_received: selectedOutcomeInfo.otherOutcome,
              roulette_red: wheelModel.red_outcome,
              roulette_black: wheelModel.black_outcome,
              rt_roulette_change_from_outcome: "",
              rt_roulette_change_from_sample: Math.round(action.timestamp - lastSampleShownAt)
            });
            changeRow.click_counter_spin_from_roulette_change_to_spin = await this.playWhiteFlash(CONFIG.keys.spin.code);
            rows.push(changeRow);
            const trackerResult = tracker.end();
            this.fillSectionOutcome(rows, trackerResult);
            trialEnded = true;
          }

          return {
            rows: rows,
            summary: {
              domain: trialContext.domain,
              received_outcome: selectedOutcomeInfo.selectedOutcome,
              not_received_outcome: selectedOutcomeInfo.otherOutcome,
              roulette_red: wheelModel.red_outcome,
              roulette_black: wheelModel.black_outcome,
              start_with_black: wheelModel.start_with_black
            }
          };
        }

        appendTutorialLine(text) {
          const body = this.query("#tutorial-instruction-body");
          if (!body) {
            return;
          }
          Array.from(body.children).forEach((node) => node.classList.add("old"));
          const paragraph = document.createElement("p");
          paragraph.className = "tutorial-line";
          paragraph.innerHTML = text;
          body.appendChild(paragraph);
          body.scrollTop = body.scrollHeight;
        }

        async runTutorial(tutorialTrials, tutorialOrder) {
          this.currentSectionType = "tutorial";
          const tracker = createSectionTracker("tutorial");
          const rows = [];
          const tutorialLines = [];
          let sampleWindow = [];
          let pendingTutorialJCounter = 0;
          const trialContexts = tutorialTrials.map((trial, index) => Object.assign({}, trial, {
            trial_number: index + 1,
            domain_block_order: 0,
            outcomes: trial.outcomes.slice()
          }));
          if (trialContexts.length !== 3) {
            throw new Error("Tutorial must contain exactly three randomized trial instances.");
          }

          const getTutorialScrollState = () => {
            const body = this.query("#tutorial-instruction-body");
            if (!body) {
              return null;
            }
            return {
              scrollTop: body.scrollTop,
              distanceFromBottom: Math.max(0, body.scrollHeight - body.clientHeight - body.scrollTop)
            };
          };

          const renderTutorialLines = (options) => {
            const body = this.query("#tutorial-instruction-body");
            if (!body) {
              return;
            }
            body.innerHTML = tutorialLines.map((line, index) => {
              return '<p class="tutorial-line' + (index === tutorialLines.length - 1 ? "" : " old") + '">' + line + "</p>";
            }).join("");
            if (options && options.preserveScrollState) {
              body.scrollTop = Math.max(0, body.scrollHeight - body.clientHeight - options.preserveScrollState.distanceFromBottom);
              return;
            }
            body.scrollTop = body.scrollHeight;
          };

          const pushTutorialLine = async (html, waitAfter) => {
            tutorialLines.push(html);
            renderTutorialLines();
            if (waitAfter) {
              await sleep(typeof waitAfter === "number" ? waitAfter : CONFIG.timings.tutorial_text_interval_ms);
            }
          };

          const prepareTutorialScreen = (trialContext, options) => {
            const scrollState = getTutorialScrollState();
            this.render(this.buildTaskLayout({ pageTitle: "Tutorial", showTutorialPanel: true }));
            renderTutorialLines({ preserveScrollState: scrollState });
            this.setStartingAmountDisplay(trialContext.domain);
            this.setOutcomeDisplay("__dots__", false);
            this.renderSamplingList(sampleWindow);
            this.updateActionStrip([{ label: "SPACE = Spin", ready: true }]);
            this.setSamplingControlState({
              jText: "J = See participants' outcomes",
              jReady: Boolean(options && options.jReady),
              fText: "F = Next roulette",
              fReady: Boolean(options && options.fReady)
            });
            const canvas = this.query("#roulette-canvas");
            const wheelModel = this.createWheelModel(trialContext);
            this.drawWheel(canvas, wheelModel, this.currentWheelAngle);
            return { canvas: canvas, wheelModel: wheelModel };
          };

          const waitForSingleKey = (code) => {
            return new Promise((resolve) => {
              this.setKeyHandler((event) => {
                if (event.code !== code) {
                  this.invalidKeypressCount += 1;
                  return;
                }
                this.clearActiveKeyHandler();
                resolve(performance.now());
              });
            });
          };

          const waitForTutorialSampleOrNext = (allowNext) => {
            return new Promise((resolve) => {
              this.setKeyHandler((event) => {
                if (event.code === CONFIG.keys.sample.code) {
                  this.clearActiveKeyHandler();
                  resolve({ type: "sample", keyTime: performance.now() });
                  return;
                }
                if (allowNext && event.code === CONFIG.keys.next.code) {
                  this.clearActiveKeyHandler();
                  resolve({ type: "next", keyTime: performance.now() });
                  return;
                }
                this.invalidKeypressCount += 1;
              });
            });
          };

          const startTutorialCooldown = async (allowExitDuringCooldown) => {
            const start = performance.now();
            let exitDuringCooldown = null;
            this.setKeyHandler((event) => {
              if (event.code === CONFIG.keys.sample.code) {
                pendingTutorialJCounter += 1;
                this.invalidKeypressCount += 1;
                return;
              }
              if (allowExitDuringCooldown && event.code === CONFIG.keys.next.code) {
                exitDuringCooldown = { type: "next", keyTime: performance.now() };
                this.clearActiveKeyHandler();
                return;
              }
              this.invalidKeypressCount += 1;
            });

            while (!exitDuringCooldown && (performance.now() - start) < CONFIG.timings.sample_cooldown_ms) {
              const progress = clamp((performance.now() - start) / CONFIG.timings.sample_cooldown_ms, 0, 1);
              this.setSamplingControlState({
                jText: "J = See participants' outcomes",
                jCooldown: false,
                jReady: true,
                jProgress: progress,
                fText: "F = Next roulette",
                fReady: true
              });
              await nextFrame();
            }
            this.clearActiveKeyHandler();
            if (!exitDuringCooldown) {
              this.setSamplingControlState({
                jText: "J = See participants' outcomes",
                jReady: true,
                fText: "F = Next roulette",
                fReady: true
              });
            }
            return exitDuringCooldown;
          };

          const finalizeTutorialTrialRows = (trialRows) => {
            rows.push.apply(rows, trialRows);
          };

          const setDuringSpinCounters = (spinResult, firstActionCounters) => {
            if (!spinResult || !spinResult.spinRow || !firstActionCounters) {
              return;
            }
            spinResult.spinRow.click_counter_roulette_change_during_spin = firstActionCounters.roulette_change;
            spinResult.spinRow.click_counter_sample_during_spin = firstActionCounters.sample;
            spinResult.spinRow.click_counter_spin_during_spin = firstActionCounters.spin;
          };

          const performSpin = async (trialContext, wheelModel) => {
            this.updateActionStrip([{ label: "SPACE = Spin", ready: true }]);
            const readyAt = performance.now();
            const keyTime = await new Promise((resolve) => {
              this.setKeyHandler((event) => {
                if (event.code !== CONFIG.keys.spin.code) {
                  this.invalidKeypressCount += 1;
                  return;
                }
                this.clearActiveKeyHandler();
                resolve(performance.now());
              });
            });
            const spinRt = Math.round(keyTime - readyAt);
            const selectedOutcomeInfo = this.chooseRouletteOutcome(wheelModel);
            const firstActionWatcher = this.createFirstPostSpinWatcher();
            const spinRow = this.createTaskBaseRow("tutorial", trialContext, {
              action_type: "spin",
              event_index_within_trial: 1,
              roulette_outcome: selectedOutcomeInfo.selectedOutcome,
              roulette_outcome_not_received: selectedOutcomeInfo.otherOutcome,
              roulette_red: wheelModel.red_outcome,
              roulette_black: wheelModel.black_outcome,
              rt_spin: spinRt,
              tutorial_order: tutorialOrder
            });
            this.updateActionStrip([{ label: "Wheel spinning...", muted: true }]);
            await this.animateSpin(this.query("#roulette-canvas"), wheelModel, selectedOutcomeInfo.targetIndex);
            this.setOutcomeDisplay(selectedOutcomeInfo.selectedOutcome, false);
            this.updateActionStrip([{ label: "SPACE = Spin", ready: true }]);
            firstActionWatcher.markSpinComplete();
            return {
              spinRow: spinRow,
              selectedOutcomeInfo: selectedOutcomeInfo,
              spinFinishedAt: performance.now(),
              firstActionWatcher: firstActionWatcher
            };
          };

          const performSample = async (trialContext, wheelModel, selectedOutcomeInfo, sampleIndex, spinFinishedAt, lastSampleReadyAt, existingKeyTime) => {
            this.updateActionStrip([{ label: "SPACE = Spin", ready: true }]);
            let keyTime;
            if (sampleIndex > 1) {
              if (existingKeyTime !== undefined) {
                keyTime = existingKeyTime;
              } else {
                keyTime = await new Promise((resolve) => {
                  this.setKeyHandler((event) => {
                    if (event.code !== CONFIG.keys.sample.code) {
                      this.invalidKeypressCount += 1;
                      return;
                    }
                    this.clearActiveKeyHandler();
                    resolve(performance.now());
                  });
                });
              }
            } else {
              keyTime = existingKeyTime !== undefined ? existingKeyTime : await waitForSingleKey(CONFIG.keys.sample.code);
            }
            if (!trialContext._trialUsedNames) {
              trialContext._trialUsedNames = new Set();
            }
            const sampleData = this.sampleOtherParticipant(trialContext, trialContext._trialUsedNames);
            sampleWindow.push(sampleData.display_line);
            sampleWindow = sampleWindow.slice(-CONFIG.sampling_visible_capacity);
            this.renderSamplingList(sampleWindow);
            const shownAt = performance.now();
            const clickCounterBetweenSamples = sampleIndex > 1 ? pendingTutorialJCounter : "";
            const sampleRow = this.createTaskBaseRow("tutorial", trialContext, {
              action_type: "sample",
              event_index_within_trial: sampleIndex + 1,
              roulette_outcome: selectedOutcomeInfo.selectedOutcome,
              roulette_outcome_not_received: selectedOutcomeInfo.otherOutcome,
              roulette_red: wheelModel.red_outcome,
              roulette_black: wheelModel.black_outcome,
              rt_sample_from_outcome: sampleIndex === 1 ? Math.round(keyTime - spinFinishedAt) : "",
              rt_sample_from_sample: sampleIndex > 1 ? Math.round(keyTime - lastSampleReadyAt) : "",
              click_counter_sample_from_sample_to_sample: clickCounterBetweenSamples,
              sample_index_within_trial: sampleIndex,
              sampled_name: sampleData.sampled_name,
              sampled_name_sex: sampleData.sampled_name_sex,
              sampled_name_rank: sampleData.sampled_name_rank,
              sampled_roulette_outcome: sampleData.sampled_roulette_outcome,
              sampled_earnings: sampleData.sampled_earnings,
              tutorial_order: tutorialOrder
            });
            if (sampleIndex > 1) {
              pendingTutorialJCounter = 0;
            }
            return {
              sampleRow: sampleRow,
              shownAt: shownAt,
              readyAt: shownAt + CONFIG.timings.sample_cooldown_ms
            };
          };

          const performRouletteChange = async (trialContext, wheelModel, selectedOutcomeInfo, eventIndex, spinFinishedAt, lastSampleShownAt, sampledBefore, existingKeyTime) => {
            this.updateActionStrip([{ label: "SPACE = Spin", ready: true }]);
            const keyTime = existingKeyTime !== undefined ? existingKeyTime : await waitForSingleKey(CONFIG.keys.next.code);
            const changeRow = this.createTaskBaseRow("tutorial", trialContext, {
              action_type: "roulette_change",
              event_index_within_trial: eventIndex,
              roulette_outcome: selectedOutcomeInfo.selectedOutcome,
              roulette_outcome_not_received: selectedOutcomeInfo.otherOutcome,
              roulette_red: wheelModel.red_outcome,
              roulette_black: wheelModel.black_outcome,
              rt_roulette_change_from_outcome: sampledBefore ? "" : Math.round(keyTime - spinFinishedAt),
              rt_roulette_change_from_sample: sampledBefore ? Math.round(keyTime - lastSampleShownAt) : "",
              tutorial_order: tutorialOrder
            });
            pendingTutorialJCounter = 0;
            changeRow.click_counter_spin_from_roulette_change_to_spin = await this.playWhiteFlash(CONFIG.keys.spin.code);
            sampleWindow = [];
            return changeRow;
          };

          const getTutorialOutcomeSentence = (selectedOutcome) => {
            const sign = selectedOutcome >= 0 ? "+" : "-";
            const amount = CONFIG.number_formatting.currency_symbol + Math.abs(selectedOutcome);
            return "Your roulette outcome is " + sign + amount + ".";
          };

          let trialRender = prepareTutorialScreen(trialContexts[0], { jReady: true, fReady: true });
          await pushTutorialLine("This brief tutorial explains how to play the Roulette Game.", true);
          await pushTutorialLine("At the top left, you can see the amount of money you are endowed with.", true);
          await pushTutorialLine("The roulette outcome is shown at the top right.", true);
          await pushTutorialLine("Throughout the Roulette Game you will need to use the keyboard.", true);
          await pushTutorialLine("You will use three keys: <strong>SPACE</strong> to spin the roulette, <strong>J</strong> to see previous participants' outcomes, and <strong>F</strong> to move to the next roulette.", 4000);
          await pushTutorialLine("You can place the index finger of your left hand on <strong>F</strong>, the index finger of your right hand on <strong>J</strong> and the thumbs on <strong>SPACE</strong>.", 4000);
          await pushTutorialLine("Press <strong>SPACE</strong> to spin the wheel.", false);

          const tutorialTrial1Rows = [];
          const firstSpin = await performSpin(trialContexts[0], trialRender.wheelModel);
          tutorialTrial1Rows.push(firstSpin.spinRow);
          await pushTutorialLine(getTutorialOutcomeSentence(firstSpin.selectedOutcomeInfo.selectedOutcome), true);

          const tutorialTrial2Rows = [];
          if (tutorialOrder === "j_first") {
            await pushTutorialLine("After spinning the roulette you can decide whether to see the outcomes of previous participants. You can press <strong>J</strong> to see the outcome of a previous participant, or <strong>F</strong> to move to the next roulette.", 5000);
            await pushTutorialLine("Press <strong>J</strong> to see how previous participants' outcomes are displayed.", false);

            firstSpin.firstActionWatcher.setAllowed({ sample: true, next: false });
            const firstTutorialAction = await firstSpin.firstActionWatcher.promise;
            setDuringSpinCounters(firstSpin, firstTutorialAction.counters);
            let sampleResult = await performSample(trialContexts[0], trialRender.wheelModel, firstSpin.selectedOutcomeInfo, 1, firstSpin.spinFinishedAt, null, firstTutorialAction.keyTime);
            tutorialTrial1Rows.push(sampleResult.sampleRow);
            await startTutorialCooldown(false);

            await pushTutorialLine("Press <strong>J</strong> at least two more times.", false);
            let currentSampleCount = 1;
            let lastSampleShownAt = sampleResult.shownAt;
            let lastSampleReadyAt = sampleResult.readyAt;
            while (currentSampleCount < 3) {
              currentSampleCount += 1;
              sampleResult = await performSample(trialContexts[0], trialRender.wheelModel, firstSpin.selectedOutcomeInfo, currentSampleCount, firstSpin.spinFinishedAt, lastSampleReadyAt);
              tutorialTrial1Rows.push(sampleResult.sampleRow);
              lastSampleShownAt = sampleResult.shownAt;
              lastSampleReadyAt = sampleResult.readyAt;
              await startTutorialCooldown(false);
            }

            await pushTutorialLine("The names displayed are first names of previous participants in the study.", false);
            await pushTutorialLine("When you want to move to the next roulette, press <strong>F</strong>.", false);
            let waitingOnFirstRoulette = true;
            let firstRouletteExitKeyTime = null;
            while (waitingOnFirstRoulette) {
              const nextAction = await waitForTutorialSampleOrNext(true);
              if (nextAction.type === "sample") {
                currentSampleCount += 1;
                sampleResult = await performSample(trialContexts[0], trialRender.wheelModel, firstSpin.selectedOutcomeInfo, currentSampleCount, firstSpin.spinFinishedAt, lastSampleReadyAt, nextAction.keyTime);
                tutorialTrial1Rows.push(sampleResult.sampleRow);
                lastSampleShownAt = sampleResult.shownAt;
                lastSampleReadyAt = sampleResult.readyAt;
                const cooldownExit = await startTutorialCooldown(true);
                if (cooldownExit) {
                  firstRouletteExitKeyTime = cooldownExit.keyTime;
                  waitingOnFirstRoulette = false;
                }
              } else {
                firstRouletteExitKeyTime = nextAction.keyTime;
                waitingOnFirstRoulette = false;
              }
            }
            const changeRow1 = await performRouletteChange(trialContexts[0], trialRender.wheelModel, firstSpin.selectedOutcomeInfo, currentSampleCount + 2, firstSpin.spinFinishedAt, lastSampleShownAt, true, firstRouletteExitKeyTime);
            tutorialTrial1Rows.push(changeRow1);
            finalizeTutorialTrialRows(tutorialTrial1Rows);

            trialRender = prepareTutorialScreen(trialContexts[1], { jReady: true, fReady: true });
            await pushTutorialLine("Now press <strong>SPACE</strong> to spin the new roulette.", false);
            const secondSpin = await performSpin(trialContexts[1], trialRender.wheelModel);
            tutorialTrial2Rows.push(secondSpin.spinRow);
            await pushTutorialLine(getTutorialOutcomeSentence(secondSpin.selectedOutcomeInfo.selectedOutcome), true);
            await pushTutorialLine("Now try the other option. Press <strong>F</strong> to move directly to the next roulette without seeing previous participants' outcomes.", false);
            secondSpin.firstActionWatcher.setAllowed({ sample: false, next: true });
            const secondTutorialAction = await secondSpin.firstActionWatcher.promise;
            setDuringSpinCounters(secondSpin, secondTutorialAction.counters);
            const changeRow2 = await performRouletteChange(trialContexts[1], trialRender.wheelModel, secondSpin.selectedOutcomeInfo, 2, secondSpin.spinFinishedAt, null, false, secondTutorialAction.keyTime);
            tutorialTrial2Rows.push(changeRow2);
            finalizeTutorialTrialRows(tutorialTrial2Rows);
          } else {
            await pushTutorialLine("After spinning the roulette you can decide whether to see the outcomes of previous participants. You can press <strong>J</strong> to see the outcome of a previous participant, or <strong>F</strong> to move to the next roulette.", 5000);
            await pushTutorialLine("Now press <strong>F</strong> to move directly to the next roulette without seeing previous participants' outcomes.", false);
            firstSpin.firstActionWatcher.setAllowed({ sample: false, next: true });
            const firstTutorialAction = await firstSpin.firstActionWatcher.promise;
            setDuringSpinCounters(firstSpin, firstTutorialAction.counters);
            const changeRow1 = await performRouletteChange(trialContexts[0], trialRender.wheelModel, firstSpin.selectedOutcomeInfo, 2, firstSpin.spinFinishedAt, null, false, firstTutorialAction.keyTime);
            tutorialTrial1Rows.push(changeRow1);
            finalizeTutorialTrialRows(tutorialTrial1Rows);

            trialRender = prepareTutorialScreen(trialContexts[1], { jReady: true, fReady: true });
            await pushTutorialLine("Now press <strong>SPACE</strong> to spin the new roulette.", false);
            const secondSpin = await performSpin(trialContexts[1], trialRender.wheelModel);
            tutorialTrial2Rows.push(secondSpin.spinRow);
            await pushTutorialLine(getTutorialOutcomeSentence(secondSpin.selectedOutcomeInfo.selectedOutcome), true);
            await pushTutorialLine("Now try the other option. Press <strong>J</strong> to see how previous participants' outcomes are displayed.", false);

            secondSpin.firstActionWatcher.setAllowed({ sample: true, next: false });
            const secondTutorialAction = await secondSpin.firstActionWatcher.promise;
            setDuringSpinCounters(secondSpin, secondTutorialAction.counters);
            let sampleResult = await performSample(trialContexts[1], trialRender.wheelModel, secondSpin.selectedOutcomeInfo, 1, secondSpin.spinFinishedAt, null, secondTutorialAction.keyTime);
            tutorialTrial2Rows.push(sampleResult.sampleRow);
            await startTutorialCooldown(false);

            await pushTutorialLine("Press <strong>J</strong> at least two more times.", false);
            let currentSampleCount = 1;
            let lastSampleShownAt = sampleResult.shownAt;
            let lastSampleReadyAt = sampleResult.readyAt;
            while (currentSampleCount < 3) {
              currentSampleCount += 1;
              sampleResult = await performSample(trialContexts[1], trialRender.wheelModel, secondSpin.selectedOutcomeInfo, currentSampleCount, secondSpin.spinFinishedAt, lastSampleReadyAt);
              tutorialTrial2Rows.push(sampleResult.sampleRow);
              lastSampleShownAt = sampleResult.shownAt;
              lastSampleReadyAt = sampleResult.readyAt;
              await startTutorialCooldown(false);
            }

            await pushTutorialLine("The names displayed are first names of previous participants in the study.", false);
            await pushTutorialLine("When you want to move to the next roulette, press <strong>F</strong>.", false);
            let waitingOnSecondRoulette = true;
            let secondRouletteExitKeyTime = null;
            while (waitingOnSecondRoulette) {
              const nextAction = await waitForTutorialSampleOrNext(true);
              if (nextAction.type === "sample") {
                currentSampleCount += 1;
                sampleResult = await performSample(trialContexts[1], trialRender.wheelModel, secondSpin.selectedOutcomeInfo, currentSampleCount, secondSpin.spinFinishedAt, lastSampleReadyAt, nextAction.keyTime);
                tutorialTrial2Rows.push(sampleResult.sampleRow);
                lastSampleShownAt = sampleResult.shownAt;
                lastSampleReadyAt = sampleResult.readyAt;
                const cooldownExit = await startTutorialCooldown(true);
                if (cooldownExit) {
                  secondRouletteExitKeyTime = cooldownExit.keyTime;
                  waitingOnSecondRoulette = false;
                }
              } else {
                secondRouletteExitKeyTime = nextAction.keyTime;
                waitingOnSecondRoulette = false;
              }
            }
            const changeRow2 = await performRouletteChange(trialContexts[1], trialRender.wheelModel, secondSpin.selectedOutcomeInfo, currentSampleCount + 2, secondSpin.spinFinishedAt, lastSampleShownAt, true, secondRouletteExitKeyTime);
            tutorialTrial2Rows.push(changeRow2);
            finalizeTutorialTrialRows(tutorialTrial2Rows);
          }

          trialRender = prepareTutorialScreen(trialContexts[2], { jReady: true, fReady: true });
          this.updateActionStrip([{ label: "SPACE = Spin", ready: true }]);
          await pushTutorialLine("This is a quick summary:", true);
          await pushTutorialLine("After each spin, you can choose between two actions.", true);
          await pushTutorialLine("Press <strong>J</strong> to see previous participants' outcomes or press <strong>F</strong> to move to the next roulette.", true);
          await pushTutorialLine("After the new roulette appears, press <strong>SPACE</strong> to spin it again.", true);
          await pushTutorialLine("To finish the tutorial, click the <strong>Next</strong> button with your mouse.", false);
          this.query(".task-screen").insertAdjacentHTML(
            "beforeend",
            '<div class="tutorial-completion-box">' +
              '<p>You have completed the tutorial.</p>' +

                ];

                }

            ]);

      class RouletteExperimentPlugin {
        constructor(jsPsych) {
          this.jsPsych = jsPsych;
        }

        trial(display_element, trial) {
          const runner = new ExperimentRunner(display_element, this.jsPsych);
          let finished = false;
          const finishOnce = (data) => {
            if (finished) {
              return;
            }
            finished = true;
            runner.clearActiveKeyHandler();
            this.jsPsych.finishTrial(data);
          };
          runner.run().then((completionRow) => {
            finishOnce(completionRow);
          }).catch((error) => {
            console.error("Experiment controller error:", error);
            showDiagnostic({
              title: "The experiment could not continue.",
              subtitle: "Please contact the researcher.",
              message: "A runtime error interrupted the experiment.",
              stage: APP.startupStage,
              detail: error && error.message ? error.message : String(error)
            });
            const fallback = emptyRow(runner.randomSeed);
            fallback.section_type = runner.currentSectionType || "completion_page";
            fallback.time_scope = getTimeScopeForSection(fallback.section_type);
            fallback.fullscreen_maintained = Boolean(document.fullscreenElement);
            fallback.section_time = 0;
            runner.applyParticipantFieldsToRow(fallback);
            finishOnce(fallback);
          });
        }
      }

      RouletteExperimentPlugin.info = {
        name: "roulette-experiment-controller",
        parameters: {}
      };

      async function bootExperiment() {
        APP.watchdogId = window.setTimeout(() => {
          if (!APP.firstVisibleRendered) {
            showDiagnostic({
              title: "The experiment could not be started.",
              subtitle: "Please contact the researcher.",
              message: "jsPsych could not be loaded, or startup did not finish in time. Please allow the browser to load scripts from the CDN and reopen the experiment.",
              stage: APP.startupStage
            });
          }
        }, CONFIG.timings.startup_watchdog_ms);

        try {
          setStartupStage("loading jsPsych");
          await loadStylesheetWithFallback([
            "https://unpkg.com/jspsych@8.2.1/css/jspsych.css",
            "https://cdn.jsdelivr.net/npm/jspsych@8.2.1/css/jspsych.css"
          ]);

          if (!window.initJsPsych) {
            try {
              await loadScriptWithFallback([
                "https://unpkg.com/jspsych@8.2.1",
                "https://cdn.jsdelivr.net/npm/jspsych@8.2.1"
              ]);
            } catch (error) {
              console.error("Failed to load jsPsych from all configured CDNs.", error);
              showDiagnostic({
                title: "The experiment could not be started.",
                subtitle: "Please contact the researcher.",
                message: "jsPsych could not be loaded. Please allow the browser to load scripts from the CDN and reopen the experiment.",
                stage: APP.startupStage,
                detail: error && error.message ? error.message : String(error)
              });
              return;
            }
          }

          if (!window.initJsPsych) {
            showDiagnostic({
              title: "The experiment could not be started.",
              subtitle: "Please contact the researcher.",
              message: "jsPsych could not be loaded. Please allow the browser to load scripts from the CDN and reopen the experiment.",
              stage: APP.startupStage,
              detail: "window.initJsPsych is unavailable after script loading."
            });
            return;
          }

          APP.isPavlovia = detectPavloviaMode();
          let PavloviaPlugin = null;
          if (APP.isPavlovia) {
            setStartupStage("loading Pavlovia plugin");
            try {
              await loadScriptWithFallback(["lib/jspsych-7-pavlovia-2022.1.1.js"]);
            } catch (error) {
              console.error("Failed to load Pavlovia integration plugin.", error);
              showDiagnostic({
                title: "The experiment could not be started.",
                subtitle: "Please contact the researcher.",
                message: "The Pavlovia integration plugin could not be loaded.",
                stage: APP.startupStage,
                detail: error && error.message ? error.message : String(error)
              });
              return;
            }
            PavloviaPlugin = window.jsPsychPavlovia || window.jsPsychPavloviaPlugin || window.jsPsychPavlovia;
            if (!PavloviaPlugin) {
              showDiagnostic({
                title: "The experiment could not be started.",
                subtitle: "Please contact the researcher.",
                message: "The Pavlovia integration plugin is missing.",
                stage: APP.startupStage,
                detail: "window.jsPsychPavlovia is unavailable after loading."
              });
              return;
            }
            APP.PavloviaPlugin = PavloviaPlugin;
          }

          const target = getRoot(ROOT_IDS.jspsych);
          if (!target) {
            showDiagnostic({
              title: "The experiment could not be started.",
              subtitle: "Please contact the researcher.",
              message: "The jsPsych target element is missing.",
              stage: APP.startupStage,
              detail: "Could not find #jspsych-target in the document."
            });
            return;
          }

          let jsPsych;
          setStartupStage("initializing jsPsych");
          try {
            jsPsych = initJsPsych({
              display_element: target.id,
              on_finish: function () {
                if (CONFIG.study.collect_persistent_data && !APP.isPavlovia && CONFIG.study.enable_local_save_debug) {
                  jsPsych.data.get().localSave("csv", "debug_data.csv");
                }
                if (CONFIG.study.collect_persistent_data && APP.isPavlovia && APP.shouldRedirectToProlificOnFinish) {
                  const prolificCompletionUrl = getProlificCompletionUrl();
                  if (prolificCompletionUrl) {
                    window.setTimeout(() => {
                      window.location.replace(prolificCompletionUrl);
                    }, 50);
                  }
                }
              }
            });
          } catch (error) {
            console.error("initJsPsych failed:", error);
            showDiagnostic({
              title: "The experiment could not be started.",
              subtitle: "Please contact the researcher.",
              message: "jsPsych failed during initialization.",
              stage: APP.startupStage,
              detail: error && error.message ? error.message : String(error)
            });
            return;
          }
          APP.jsPsych = jsPsych;

          setStartupStage("building timeline");
          syncPavloviaParticipantId();
          const experimentTimeline = [
            { type: RouletteExperimentPlugin }
          ];
          const timeline = [];

          if (APP.isPavlovia) {
            timeline.push({
              type: PavloviaPlugin,
              command: "init",
              participantId: getPavloviaParticipantLabel(),
              sessionId: getPavloviaSessionLabel()
            });
          }

          timeline.push.apply(timeline, experimentTimeline);

          if (APP.isPavlovia) {
            timeline.push({
              type: PavloviaPlugin,
              command: "finish",
              participantId: getPavloviaParticipantLabel(),
              sessionId: getPavloviaSessionLabel()
            });
          }

          setStartupStage("starting timeline");
          jsPsych.run(timeline);
        } catch (error) {
          console.error("Fatal boot error:", error);
          showDiagnostic({
            title: "The experiment could not be started.",
            subtitle: "Please contact the researcher.",
            message: "A startup exception interrupted the experiment.",
            stage: APP.startupStage,
            detail: error && error.message ? error.message : String(error)
          });
        }
      }

      document.addEventListener("DOMContentLoaded", function () {
        try {
          activateCvReviewMenu();
          bootExperiment();
        } catch (error) {
          console.error("Top-level boot failure:", error);
          showDiagnostic({
            title: "The experiment could not be started.",
            subtitle: "Please contact the researcher.",
            message: "A startup exception interrupted the experiment.",
            stage: APP.startupStage,
            detail: error && error.message ? error.message : String(error)
          });
        }
      });
    })();
  </script>
