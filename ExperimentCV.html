<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roulette Experiment</title>
  <link rel="preload" as="image" href="./Ladder.png">
  <style>
    :root {
      --bg-main: #f6f6f6;
      --bg-panel: rgba(255, 255, 255, 0.92);
      --bg-panel-solid: #ffffff;
      --bg-soft: #f2f4f8;
      --text-main: #1d2736;
      --text-muted: #57627a;
      --border-soft: #d6dce8;
      --border-mid: #bac4d8;
      --accent-blue: #2e5bff;
      --accent-blue-soft: rgba(46, 91, 255, 0.12);
      --accent-blue-soft-strong: rgba(46, 91, 255, 0.18);
      --good-green: #1f8f5f;
      --good-green-soft: rgba(31, 143, 95, 0.14);
      --bad-red: #c54d4d;
      --bad-red-soft: rgba(197, 77, 77, 0.10);
      --shadow-panel: 0 28px 80px rgba(22, 31, 52, 0.10);
      --shadow-soft: 0 12px 34px rgba(22, 31, 52, 0.08);
      --font-ui: "Trebuchet MS", "Avenir Next", "Segoe UI", sans-serif;
      --font-serif: Georgia, "Times New Roman", serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at top left, rgba(255, 255, 255, 0.72), transparent 34%),
        linear-gradient(180deg, #f8f8f8 0%, var(--bg-main) 55%, #f1f2f4 100%);
      color: var(--text-main);
      font-family: var(--font-ui);
    }

    body {
      position: relative;
    }

    .cv-review-menu {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 1000;
      color: var(--text-main);
      font-family: var(--font-ui);
      font-size: 14px;
    }

    .cv-review-menu details {
      width: min(280px, calc(100vw - 28px));
      border: 1px solid rgba(186, 196, 216, 0.9);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 14px 36px rgba(22, 31, 52, 0.14);
      overflow: hidden;
    }

    .cv-review-menu summary {
      cursor: pointer;
      padding: 10px 12px;
      font-weight: 700;
      list-style-position: inside;
    }

    .cv-review-menu-panel {
      border-top: 1px solid var(--border-soft);
      padding: 10px 12px 12px;
    }

    .cv-review-menu-note {
      margin: 0 0 10px;
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .cv-review-menu a {
      display: block;
      border-radius: 7px;
      color: var(--text-main);
      padding: 7px 8px;
      text-decoration: none;
    }

    .cv-review-menu a:hover,
    .cv-review-menu a[aria-current="page"] {
      background: var(--accent-blue-soft);
      color: var(--accent-blue);
    }

    #jspsych-target,
    #persistent-root,
    #diagnostic-root {
      position: fixed;
      inset: 0;
    }

    #persistent-root,
    #diagnostic-root {
      pointer-events: none;
      z-index: 40;
    }

    #persistent-root > *,
    #diagnostic-root > * {
      pointer-events: auto;
    }

    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      background: transparent;
    }

    .screen-scrollable {
      overflow-y: auto;
      align-items: flex-start;
    }

    .hero-card,
    .form-card,
    .question-card,
    .message-card {
      width: min(900px, calc(100vw - 64px));
      background: var(--bg-panel);
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 28px;
      box-shadow: var(--shadow-panel);
      backdrop-filter: blur(10px);
      padding: 44px 48px;
    }

    .hero-card {
      display: grid;
      gap: 18px;
      justify-items: center;
      text-align: center;
      min-height: 360px;
      align-content: center;
    }

    .hero-text {
      max-width: 680px;
      font-size: 28px;
      line-height: 1.55;
      color: var(--text-main);
    }

    .hero-text p,
    .message-card p {
      margin: 0;
    }

    .form-card,
    .question-card,
    .message-card {
      display: grid;
      gap: 20px;
      align-content: center;
      justify-items: center;
      text-align: center;
      min-height: 520px;
    }

    .message-card {
      min-height: 420px;
      gap: 16px;
    }

    .message-card.bulleted-layout {
      justify-items: stretch;
      text-align: left;
    }

    .message-card.bulleted-layout .page-title {
      text-align: center;
    }

    .message-card.bulleted-layout .action-box,
    .message-card.bulleted-layout .inline-validation {
      justify-self: center;
    }

    .form-card.bulleted-layout {
      justify-items: stretch;
      text-align: left;
    }

    .form-card.bulleted-layout .page-title {
      text-align: center;
    }

    .form-card.bulleted-layout .form-stack,
    .form-card.bulleted-layout .inline-validation,
    .form-card.bulleted-layout .ui-button {
      justify-self: center;
    }

    .message-intro-paragraphs {
      max-width: 720px;
      justify-self: center;
      text-align: center;
    }

    .message-intro-paragraphs p {
      margin: 0;
    }

    .message-intro-paragraphs p + p {
      margin-top: 12px;
    }

    .message-list {
      width: 100%;
      max-width: 720px;
      margin: 0;
      padding-left: 28px;
      justify-self: start;
      list-style: disc;
    }

    .message-list li {
      margin: 0;
      font-size: 22px;
      line-height: 1.6;
      color: var(--text-muted);
    }

    .message-list li + li {
      margin-top: 10px;
    }

    .page-title {
      margin: 0;
      font-family: var(--font-serif);
      font-size: 42px;
      line-height: 1.1;
      letter-spacing: 0.02em;
      color: #20304a;
    }

    .page-subtitle,
    .message-card p,
    .form-card p {
      margin: 0;
      font-size: 22px;
      line-height: 1.6;
      color: var(--text-muted);
    }

    .inline-message,
    .inline-validation,
    .inline-feedback {
      min-height: 28px;
      font-size: 18px;
      line-height: 1.45;
      color: var(--bad-red);
      text-align: center;
    }

    .inline-feedback.good {
      color: var(--good-green);
    }

    .slider-shell {
      width: min(640px, 100%);
      display: grid;
      gap: 14px;
      justify-self: center;
    }

    .slider-track-shell {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
    }

    .slider-value {
      font-size: 26px;
      font-weight: 700;
      color: #22324e;
      text-align: center;
      min-height: 1.2em;
    }

    .slider-input {
      width: 100%;
      height: 32px;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      outline: none;
      cursor: pointer;
      position: relative;
      z-index: 2;
    }

    .slider-input::-webkit-slider-runnable-track {
      height: 6px;
      border-radius: 999px;
      background: #d8dee9;
    }

    .slider-input::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--accent-blue);
      border: 2px solid #ffffff;
      box-shadow: 0 3px 10px rgba(35, 50, 78, 0.18);
      margin-top: -7px;
    }

    .slider-input.uninitialized::-webkit-slider-thumb {
      opacity: 0;
      box-shadow: none;
    }

    .slider-input::-moz-range-track {
      height: 6px;
      border-radius: 999px;
      background: #d8dee9;
      border: none;
    }

    .slider-input::-moz-range-progress {
      height: 6px;
      border-radius: 999px;
      background: #d8dee9;
      border: none;
    }

    .slider-input::-moz-range-thumb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--accent-blue);
      border: 2px solid #ffffff;
      box-shadow: 0 3px 10px rgba(35, 50, 78, 0.18);
    }

    .slider-input.uninitialized::-moz-range-thumb {
      opacity: 0;
      box-shadow: none;
    }

    .slider-end-cap {
      position: absolute;
      top: 50%;
      width: 4px;
      height: 20px;
      border-radius: 999px;
      background: #96a1b6;
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.92);
      pointer-events: none;
      z-index: 3;
    }

    .slider-end-cap-start {
      left: 0;
      transform: translate(-50%, -50%);
    }

    .slider-end-cap-end {
      left: 100%;
      transform: translate(-50%, -50%);
    }

    .slider-label-row {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      font-size: 18px;
      line-height: 1.45;
      color: var(--text-muted);
    }

    .slider-label-row span:last-child {
      text-align: right;
    }

    .likert-scale-row {
      width: min(760px, 100%);
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 10px;
      justify-self: center;
    }

    .likert-scale-row .option-card {
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-left: 0;
      padding-right: 0;
    }

    .likert-anchor-row {
      width: min(760px, 100%);
      display: flex;
      justify-content: space-between;
      gap: 24px;
      font-size: 18px;
      line-height: 1.45;
      color: var(--text-muted);
    }

    .likert-anchor-row span:last-child {
      text-align: right;
    }

    .ui-button,
    .fill-button,
    .question-next-button {
      appearance: none;
      border: 2px solid var(--border-mid);
      background:
        linear-gradient(90deg, rgba(46, 91, 255, 0.16) 0%, rgba(46, 91, 255, 0.16) calc(var(--fill-progress, 0) * 100%), rgba(255, 255, 255, 0) calc(var(--fill-progress, 0) * 100%), rgba(255, 255, 255, 0) 100%),
        #ffffff;
      color: var(--text-main);
      font-family: var(--font-ui);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.03em;
      border-radius: 999px;
      padding: 18px 34px;
      cursor: pointer;
      transition: border-color 0.14s ease, box-shadow 0.14s ease, transform 0.14s ease;
    }

    .ui-button:hover,
    .fill-button:hover,
    .question-next-button:hover {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 4px rgba(46, 91, 255, 0.10);
    }

    .fill-button.ready,
    .question-next-button.ready {
      border-color: var(--accent-blue);
    }

    .question-next-button {
      min-width: 180px;
    }

    .instruction-panel {
      width: min(980px, calc(100vw - 64px));
      height: min(760px, calc(100vh - 64px));
      display: grid;
      grid-template-rows: auto 1fr auto auto;
      gap: 18px;
      padding: 34px 36px 30px;
      border-radius: 30px;
      background: var(--bg-panel-solid);
      box-shadow: var(--shadow-panel);
      border: 1px solid rgba(240, 243, 249, 0.9);
      overflow: hidden;
    }

    .instruction-panel-title {
      margin: 0;
      font-family: var(--font-serif);
      font-size: 40px;
      line-height: 1.1;
      color: #22324e;
      text-align: center;
    }

    .instruction-panel-body {
      overflow-y: auto;
      padding: 8px 10px 4px 8px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      align-items: stretch;
      justify-content: flex-start;
      scroll-behavior: smooth;
    }

    .instruction-panel-body.scrollable {
      overflow-y: scroll;
      scrollbar-gutter: stable both-edges;
    }

    .instruction-panel-body.no-scroll {
      overflow-y: hidden;
    }

    .instruction-panel-body::-webkit-scrollbar,
    .tutorial-instruction-body::-webkit-scrollbar {
      width: 12px;
    }

    .instruction-panel-body::-webkit-scrollbar-track,
    .tutorial-instruction-body::-webkit-scrollbar-track {
      background: #eef2f8;
      border-radius: 999px;
    }

    .instruction-panel-body::-webkit-scrollbar-thumb,
    .tutorial-instruction-body::-webkit-scrollbar-thumb {
      background: #b8c3d8;
      border-radius: 999px;
      border: 2px solid #eef2f8;
    }

    .instruction-panel-body::-webkit-scrollbar-thumb:hover,
    .tutorial-instruction-body::-webkit-scrollbar-thumb:hover {
      background: #98a8c7;
    }

    .instruction-block {
      display: grid;
      gap: 10px;
      transition: opacity 0.24s ease;
      opacity: 1;
      text-align: left;
    }

    .instruction-block.old {
      opacity: 0.52;
    }

    .instruction-section-title {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.02em;
      color: #273758;
    }

    .instruction-paragraph {
      margin: 0;
      font-size: 20px;
      line-height: 1.75;
      color: #33415c;
      text-align: left;
    }

    .instruction-bottom {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 86px;
      position: relative;
      z-index: 2;
    }

    .instruction-bottom .fill-button {
      min-width: 220px;
    }

    .consent-row {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding-top: 6px;
    }

    .consent-row input[type="checkbox"] {
      margin-top: 6px;
      width: 22px;
      height: 22px;
      accent-color: var(--accent-blue);
      cursor: pointer;
      flex: 0 0 auto;
    }

    .consent-label {
      font-size: 20px;
      line-height: 1.7;
      color: #33415c;
      cursor: pointer;
    }

    .text-input,
    .textarea-input {
      width: min(580px, 82vw);
      padding: 16px 18px;
      border-radius: 14px;
      border: 2px solid #d8dee9;
      background: #ffffff;
      font-family: var(--font-ui);
      font-size: 20px;
      line-height: 1.45;
      color: var(--text-main);
      transition: border-color 0.12s ease, box-shadow 0.12s ease;
      outline: none;
      box-shadow: none;
    }

    .text-input:focus,
    .textarea-input:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 4px rgba(46, 91, 255, 0.12);
    }

    .textarea-input {
      min-height: 220px;
      resize: vertical;
      text-align: left;
    }

    .form-stack {
      display: grid;
      gap: 18px;
      justify-items: center;
      width: 100%;
    }

    .question-card {
      align-content: flex-start;
      text-align: left;
      padding-top: 38px;
      padding-bottom: 34px;
    }

    .question-card .page-title {
      width: 100%;
      text-align: center;
      margin-bottom: 8px;
    }

    .question-prompt {
      width: 100%;
      font-size: 24px;
      line-height: 1.6;
      color: #28374e;
      margin: 0 0 6px;
    }

    .option-list {
      width: 100%;
      display: grid;
      gap: 14px;
    }

    .option-card {
      width: 100%;
      border: 2px solid #d8dee9;
      border-radius: 16px;
      background: #ffffff;
      padding: 14px 16px;
      cursor: pointer;
      transition: border-color 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
      position: relative;
      font-size: 20px;
      line-height: 1.55;
      color: #2f3c54;
      text-align: left;
    }

    .option-card:hover {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 4px rgba(46, 91, 255, 0.10);
    }

    .option-card.selected {
      border-color: var(--accent-blue);
      background: #eff3ff;
      box-shadow: 0 0 0 4px rgba(46, 91, 255, 0.10);
    }

    .option-card.correct-highlight {
      border-color: #2b8d62;
      border-width: 3px;
      background: #eefaf4;
      box-shadow: 0 0 0 5px rgba(43, 141, 98, 0.16);
    }

    .option-card.wrong-secondary {
      border-color: #d9b2b2;
      background: #fff5f5;
      box-shadow: none;
      opacity: 0.84;
    }

    .option-card-tag {
      position: absolute;
      top: 12px;
      right: 14px;
      background: #2b8d62;
      color: #ffffff;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .feedback-box {
      width: 100%;
      border-radius: 18px;
      padding: 18px 20px;
      font-size: 18px;
      line-height: 1.6;
      background: #fff7f7;
      border: 2px solid rgba(197, 77, 77, 0.24);
      color: #7c3131;
    }

    .feedback-box strong {
      color: #5a1d1d;
    }

    .question-footer {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-top: 4px;
      min-height: 64px;
    }

    .task-screen {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at top left, rgba(255, 255, 255, 0.64), transparent 30%),
        linear-gradient(180deg, #f8f8f8 0%, #f6f6f6 60%, #f1f2f4 100%);
    }

    .task-page-title {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--font-serif);
      font-size: 36px;
      color: #22324e;
      letter-spacing: 0.03em;
      z-index: 3;
    }

    .task-page-title.task-page-note {
      width: min(760px, calc(100vw - 96px));
      padding: 14px 20px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(224, 231, 242, 0.96);
      box-shadow: var(--shadow-soft);
      font-family: var(--font-sans);
      font-size: 24px;
      line-height: 1.4;
      letter-spacing: 0;
      text-align: center;
    }

    .task-left-panel {
      position: absolute;
      left: 32px;
      top: 50%;
      transform: translateY(-50%);
      width: min(430px, 30vw);
      min-width: 360px;
      height: min(680px, 74vh);
      border-radius: 26px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: var(--shadow-soft);
      border: 1px solid rgba(230, 235, 244, 0.94);
      display: grid;
      grid-template-rows: auto 1fr;
      padding: 24px 22px;
      z-index: 2;
    }

    .task-left-panel-title {
      margin: 0 0 12px;
      font-size: 24px;
      color: #273758;
      text-align: center;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .tutorial-instruction-body {
      overflow-y: auto;
      padding-right: 6px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      scroll-behavior: auto;
    }

    .tutorial-line {
      margin: 0;
      font-size: 19px;
      line-height: 1.65;
      color: #33415c;
      opacity: 1;
      transition: opacity 0.22s ease;
    }

    .tutorial-line.old {
      opacity: 0.54;
    }

    .wheel-zone {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 560px;
      height: 560px;
      z-index: 2;
    }

    .wheel-display-row {
      position: absolute;
      top: -8px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: stretch;
      gap: 16px;
      z-index: 3;
    }

    .task-top-warning {
      position: absolute;
      top: calc(25% - 144px);
      left: 50%;
      transform: translate(-50%, -50%);
      width: fit-content;
      max-width: calc(100vw - 120px);
      padding: 14px 18px;
      border-radius: 20px;
      background: linear-gradient(180deg, rgba(255, 248, 215, 0.98) 0%, rgba(255, 241, 196, 0.98) 100%);
      border: 2px solid #e4a21d;
      box-shadow: 0 14px 30px rgba(89, 63, 5, 0.14);
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      z-index: 3;
    }

    .task-top-warning-icon {
      color: #9b5c00;
      font-size: 22px;
      font-weight: 900;
      line-height: 1;
      flex: 0 0 auto;
    }

    .task-top-warning-text {
      margin: 0;
      font-size: 19px;
      line-height: 1.45;
      font-weight: 800;
      color: #5e3a00;
      text-align: center;
    }

    .corner-display {
      min-width: 160px;
      padding: 14px 18px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(220, 226, 237, 0.96);
      box-shadow: 0 12px 28px rgba(23, 29, 45, 0.08);
      text-align: left;
    }

    .corner-display.right {
      text-align: right;
    }

    .corner-label {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #6b7690;
      margin-bottom: 6px;
    }

    .corner-value {
      font-size: 34px;
      font-weight: 800;
      color: #22324e;
      min-height: 42px;
    }

    .wheel-wrapper {
      position: absolute;
      inset: 78px 64px 42px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wheel-canvas {
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 16px 26px rgba(22, 31, 52, 0.16));
    }

    .wheel-pointer {
      position: absolute;
      top: -2px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 18px solid transparent;
      border-right: 18px solid transparent;

          let index = 0;
          function tryNext() {
            if (index >= urls.length) {
              resolve(false);
              return;
            }
            const href = urls[index];
            index += 1;
            const link = document.createElement("link");
            link.rel = "stylesheet";
            link.href = href;
            link.onload = function () {
              resolve(true);
            };
            link.onerror = function () {
              link.remove();
              tryNext();
            };
            document.head.appendChild(link);
          }
          tryNext();
        });
      }

      function loadScriptWithFallback(urls) {
        return new Promise((resolve, reject) => {
          let index = 0;
          let lastError = null;
          function tryNext() {
            if (index >= urls.length) {
              reject(lastError || new Error("All script sources failed."));
              return;
            }
            const src = urls[index];
            index += 1;
            const script = document.createElement("script");
            script.src = src;
            script.async = false;
            script.onload = function () {
              resolve(src);
            };
            script.onerror = function () {
              lastError = new Error("Failed to load script: " + src);
              script.remove();
              tryNext();
            };
            document.head.appendChild(script);
          }
          tryNext();
        });

      function buildAllCells() {
        const cells = [];
        ["gain", "loss"].forEach((domain) => {
          CONFIG.condition_definitions.intervals.forEach((interval) => {

              const outcomes = CONFIG.condition_definitions.condition_map

              domain: domain,
              interval_category: "",

      function validateDesign(cells, domainOrder, domainTrialsByBlock) {
        const expectedCellsPerDomain = (CONFIG.condition_definitions.intervals.length * CONFIG.condition_definitions.magnitudes.length)
          + CONFIG.condition_definitions.zero_orders.length;
        const expectedTotalCells = expectedCellsPerDomain * 2;
        const mainTaskRepetitions = Math.max(1, Number(CONFIG.condition_definitions.main_task_repetitions_per_cell || 1));
        const expectedTrialsPerDomain = expectedCellsPerDomain * mainTaskRepetitions;
        if (cells.length !== expectedTotalCells) {
          throw new Error("Internal consistency check failed: expected " + expectedTotalCells + " cells, found " + cells.length + ".");
        }
        const byDomain = cells.reduce((acc, cell) => {
          acc[cell.domain] = (acc[cell.domain] || 0) + 1;
          return acc;
        }, {});
        if (byDomain.gain !== expectedCellsPerDomain || byDomain.loss !== expectedCellsPerDomain) {
          throw new Error("Internal consistency check failed: each domain must contain " + expectedCellsPerDomain + " single-cell conditions.");
        }
        if (domainOrder.length !== 2 || !domainTrialsByBlock.gain || !domainTrialsByBlock.loss) {
          throw new Error("Internal consistency check failed: domain order or schedules missing.");
        }
        if (domainTrialsByBlock.gain.length !== expectedTrialsPerDomain || domainTrialsByBlock.loss.length !== expectedTrialsPerDomain) {
          throw new Error("Internal consistency check failed: each domain must contain " + expectedTrialsPerDomain + " randomized trial instances.");
        }
        const forbiddenToken = "data" + ".write(";
        if (document.documentElement.outerHTML.indexOf(forbiddenToken) !== -1) {
          throw new Error("Forbidden data writing pattern detected.");
        }
      }

      function createDomainSchedules(cells, rng, firstDomain) {
        const domainOrder = firstDomain === "gain" || firstDomain === "loss"
          ? [firstDomain, firstDomain === "gain" ? "loss" : "gain"]
          : shuffleWithRng(["gain", "loss"], rng);
        const trialsByBlock = {};
        const repetitionsPerCell = Math.max(1, Number(CONFIG.condition_definitions.main_task_repetitions_per_cell || 1));
        ["gain", "loss"].forEach((domain) => {
          const domainCells = cells.filter((cell) => cell.domain === domain);
          const instances = [];
          domainCells.forEach((cell) => {
            for (let repetition = 1; repetition <= repetitionsPerCell; repetition += 1) {
              instances.push(Object.assign({}, cell, { trial_within_cell: repetition }));
            }
          });
          trialsByBlock[domain] = assignDisplayedTrialWithinCell(shuffleWithRng(instances, rng));
        });
        return { domainOrder: domainOrder, trialsByBlock: trialsByBlock };
      }

      function assignDisplayedTrialWithinCell(instances) {
        const seenByCell = {};
        return instances.map((trial) => {
          const nextCount = (seenByCell[trial.cell_id] || 0) + 1;
          seenByCell[trial.cell_id] = nextCount;
          return Object.assign({}, trial, { trial_within_cell: nextCount });
        });
      }

      function createTutorialTrialContexts(cells, rng) {
        const tutorialDomain = pickWithRng(["gain", "loss"], rng);
        const domainCells = cells.filter((cell) => cell.domain === tutorialDomain);
        const tutorialTrialCount = Math.max(1, Number(CONFIG.condition_definitions.tutorial_trial_count || 3));
        const instances = domainCells.map((cell) => Object.assign({}, cell, { trial_within_cell: 1 }));
        const randomizedInstances = assignDisplayedTrialWithinCell(shuffleWithRng(instances, rng).slice(0, tutorialTrialCount));
        if (randomizedInstances.length !== tutorialTrialCount) {
          throw new Error("Tutorial schedule generation failed.");
        }
        return randomizedInstances.map((trial, index) => Object.assign({}, trial, {
          trial_number: index + 1,
          domain_block_order: 0,
          outcomes: trial.outcomes.slice()
        }));
      }

      function createSectionTracker(sectionType) {
        const tracker = {
          sectionType: sectionType,
          startTime: performance.now(),
          fullscreenMaintained: Boolean(document.fullscreenElement),
          ended: false
        };
        const listener = function () {
          if (!document.fullscreenElement) {
            tracker.fullscreenMaintained = false;
          }
        };
        document.addEventListener("fullscreenchange", listener);
        tracker.end = function () {
          if (tracker.ended) {
            return tracker.result;
          }
          tracker.ended = true;
          document.removeEventListener("fullscreenchange", listener);
          tracker.result = {
            fullscreen_maintained: tracker.fullscreenMaintained,
            section_time: Math.round(performance.now() - tracker.startTime)
          };
          return tracker.result;
        };
        return tracker;

        return "section";

      function requestExperimentFullscreen() {
        const element = document.documentElement;
        if (document.fullscreenElement) {
          return Promise.resolve(true);
        }
        if (!element.requestFullscreen) {
          return Promise.reject(new Error("Fullscreen is not supported in this browser."));
        }
        return element.requestFullscreen().then(() => true);
      }

      class ExperimentRunner {
        constructor(displayElement, jsPsych) {
          this.displayElement = displayElement;
          this.jsPsych = jsPsych;
          this.persistentRoot = getRoot(ROOT_IDS.persistent);
          this.manualRows = [];
          this.flushedManualRowCount = 0;
          this.pendingCheckpointSavePromise = Promise.resolve();
          this.remoteCheckpointBaseName = "";
          this.activeKeyCleanup = null;
          this.currentSectionType = "";
          this.invalidKeypressCount = 0;
          this.randomSeed = makeSeed();
          this.rng = createSeededRng(this.randomSeed);
          this.participantFirstName = "";
          this.participantId = "";
          this.currentWheelAngle = 0;
          this.lastMainTrialSummary = null;
          this.lastBlockSummary = null;
          this.completionOverlayVisible = false;
          this.ladderImagePreloadPromise = preloadImageAsset(CONFIG.study.ladder_image_path);
          this.mainTaskSampleIndexTotal = 0;
          this.mainTaskSampleIndexByDomain = { gain: 0, loss: 0 };
        }

        render(html) {
          this.clearActiveKeyHandler();
          this.displayElement.innerHTML = html;
          markFirstVisibleContent();
        }

        query(selector) {
          return this.displayElement.querySelector(selector);
        }

        queryAll(selector) {
          return this.displayElement.querySelectorAll(selector);
        }

        clearActiveKeyHandler() {
          if (typeof this.activeKeyCleanup === "function") {
            this.activeKeyCleanup();
            this.activeKeyCleanup = null;
          }
        }

        setKeyHandler(handler) {
          this.clearActiveKeyHandler();
          const listener = (event) => {
            if (event.repeat) {
              return;
            }
            if (["Space", "KeyJ", "KeyF", "Digit1", "Enter"].indexOf(event.code) !== -1) {
              event.preventDefault();
            }
            handler(event);
          };
          window.addEventListener("keydown", listener, true);
          this.activeKeyCleanup = () => {
            window.removeEventListener("keydown", listener, true);
          };
        }

        pushRows(rows) {
          rows.forEach((row) => {
            if (!row.section_type) {
              throw new Error("Attempted to append a row without section_type.");
            }
            this.manualRows.push(row);
          });
        }

        appendManualRowsToDataStore() {
          if (!CONFIG.study.collect_persistent_data) {
            this.flushedManualRowCount = this.manualRows.length;
            return;
          }
          const collection = this.jsPsych.data.get();
          if (!collection || typeof collection.push !== "function") {
            throw new Error("jsPsych data collection push() is unavailable.");
          }
          for (let index = this.flushedManualRowCount; index < this.manualRows.length; index += 1) {
            collection.push(this.manualRows[index]);
          }
          this.flushedManualRowCount = this.manualRows.length;
        }

        applyParticipantFieldsToRow(row) {
          if (!row) {
            return row;
          }
          if (this.participantId) {
            row.participant_id = this.participantId;
          }
          if (this.participantFirstName) {
            row.participant_first_name = this.participantFirstName;
          }
          return row;
        }

        propagateParticipantFieldsToExistingRows() {
          this.manualRows.forEach((row) => {
            this.applyParticipantFieldsToRow(row);
          });

          if (!CONFIG.study.collect_persistent_data) {
            return;
          }

          const collection = this.jsPsych.data.get();
          if (!collection || typeof collection.values !== "function") {
            return;
          }

          collection.values().forEach((row) => {
            this.applyParticipantFieldsToRow(row);
          });
        }

        getRemoteCheckpointBaseName() {
          if (this.remoteCheckpointBaseName) {
            return this.remoteCheckpointBaseName;
          }
          const pluginConfig = APP.PavloviaPlugin && APP.PavloviaPlugin._config ? APP.PavloviaPlugin._config : null;
          const experimentName = pluginConfig && pluginConfig.experiment && pluginConfig.experiment.name
            ? pluginConfig.experiment.name
            : CONFIG.study.title;
          const participantLabel = getPavloviaParticipantLabel();
          const sessionLabel = getPavloviaSessionLabel();
          const timestampLabel = ensurePavloviaFileTimestamp();
          this.remoteCheckpointBaseName = sanitizeFilenamePart(experimentName) + "_" + participantLabel + "_" + sessionLabel + "_" + timestampLabel;
          return this.remoteCheckpointBaseName;
        }

        queueRemoteNamedSave(key, saveLabel, csvSnapshot) {
          if (!CONFIG.study.collect_persistent_data) {
            return this.pendingCheckpointSavePromise;
          }
          if (!APP.isPavlovia || !APP.PavloviaPlugin || !csvSnapshot) {
            return this.pendingCheckpointSavePromise;
          }

          const pluginConfig = APP.PavloviaPlugin._config || null;
          const canUploadToServer = Boolean(
            pluginConfig &&
            pluginConfig.experiment &&
            pluginConfig.experiment.status === "RUNNING" &&
            pluginConfig.session &&
            pluginConfig.session.status === "OPEN" &&
            !(APP.PavloviaPlugin._serverMsg && APP.PavloviaPlugin._serverMsg.has("__pilotToken"))
          );

          const saveTask = async () => {
            try {
              if (!canUploadToServer) {
                return null;
              }
              const pluginInstance = new APP.PavloviaPlugin(this.jsPsych);
              return await pluginInstance._uploadData(key, csvSnapshot, false);
            } catch (error) {
              console.warn("Remote save failed for " + saveLabel + ".", error);
              return null;
            }
          };

          this.pendingCheckpointSavePromise = this.pendingCheckpointSavePromise
            .catch(() => null)
            .then(saveTask);

          return this.pendingCheckpointSavePromise;
        }

        queueRemoteCheckpointSave(checkpointLabel, csvSnapshot) {
          const key = this.getRemoteCheckpointBaseName() + "_CHECKPOINT.csv";
          return this.queueRemoteNamedSave(key, checkpointLabel, csvSnapshot);
        }

        appendRowToCsvSnapshot(csvSnapshot, row) {
          const baseSnapshot = csvSnapshot || "";
          const normalizedSnapshot = baseSnapshot.replace(/\r\n/g, "\n");
          const firstNewlineIndex = normalizedSnapshot.indexOf("\n");
          const headerLine = firstNewlineIndex === -1 ? normalizedSnapshot : normalizedSnapshot.slice(0, firstNewlineIndex);
          const body = firstNewlineIndex === -1 ? "" : normalizedSnapshot.slice(firstNewlineIndex + 1).replace(/\n$/, "");
          const headers = headerLine
            ? headerLine.split(",").map((header) => header.trim().replace(/^\uFEFF?"/, "").replace(/"$/, ""))
            : Object.keys(row);
          const rowLine = headers.map((header) => escapeCsvCell(row[header])).join(",");
          const csvWithBody = headerLine
            ? headerLine + "\n" + (body ? body + "\n" : "") + rowLine
            : headers.join(",") + "\n" + rowLine;
          return csvWithBody.replace(/\n/g, "\r\n");
        }

        queueCompletionCheckpointSave(completionRow) {
          this.appendManualRowsToDataStore();
          if (!APP.isPavlovia) {
            return Promise.resolve(null);
          }
          const collection = this.jsPsych.data.get();
          const csvSnapshot = collection && typeof collection.csv === "function" ? collection.csv() : "";
          const finalSnapshot = this.appendRowToCsvSnapshot(csvSnapshot, completionRow);
          return this.queueRemoteCheckpointSave("after_completion_page", finalSnapshot);
        }

        checkpointData(checkpointLabel) {
          this.appendManualRowsToDataStore();
          if (!APP.isPavlovia) {
            return;
          }
          const collection = this.jsPsych.data.get();
          const csvSnapshot = collection && typeof collection.csv === "function" ? collection.csv() : "";
          this.queueRemoteCheckpointSave(checkpointLabel, csvSnapshot);
        }

        makeSectionRow(sectionType, trackerResult, extras) {
          const row = emptyRow(this.randomSeed);
          row.section_type = sectionType;
          row.action_type = "";
          row.fullscreen_maintained = trackerResult.fullscreen_maintained;
          row.section_time = trackerResult.section_time;
          row.time_scope = getTimeScopeForSection(sectionType);
          Object.assign(row, extras || {});
          return this.applyParticipantFieldsToRow(row);
        }

        createTaskBaseRow(sectionType, trialContext, extras) {
          const row = emptyRow(this.randomSeed);
          row.section_type = sectionType;
          row.action_type = extras.action_type;
          row.time_scope = getTimeScopeForSection(sectionType);
          row.trial_number = trialContext.trial_number;
          row.cell_id = trialContext.cell_id;
          row.trial_within_cell = trialContext.trial_within_cell;
          row.event_index_within_trial = extras.event_index_within_trial;
          row.domain = trialContext.domain;
          row.domain_block_order = trialContext.domain_block_order;
          row.interval_category = trialContext.interval_category;
          row.endowment = trialContext.starting_amount;
          row.roulette_outcome = extras.roulette_outcome !== undefined ? extras.roulette_outcome : "";
          row.roulette_outcome_not_received = extras.roulette_outcome_not_received !== undefined ? extras.roulette_outcome_not_received : "";
          row.earnings = computeEarnings(trialContext.domain, trialContext.starting_amount, row.roulette_outcome);
          row.roulette_red = extras.roulette_red !== undefined ? extras.roulette_red : "";
          row.roulette_black = extras.roulette_black !== undefined ? extras.roulette_black : "";
          row.rt_spin = extras.rt_spin !== undefined ? extras.rt_spin : "";
          row.rt_roulette_change_from_outcome = extras.rt_roulette_change_from_outcome !== undefined ? extras.rt_roulette_change_from_outcome : "";
          row.rt_sample_from_outcome = extras.rt_sample_from_outcome !== undefined ? extras.rt_sample_from_outcome : "";
          row.rt_sample_from_sample = extras.rt_sample_from_sample !== undefined ? extras.rt_sample_from_sample : "";
          row.rt_roulette_change_from_sample = extras.rt_roulette_change_from_sample !== undefined ? extras.rt_roulette_change_from_sample : "";
          row.click_counter_spin_from_roulette_change_to_spin = extras.click_counter_spin_from_roulette_change_to_spin !== undefined ? extras.click_counter_spin_from_roulette_change_to_spin : "";
          row.click_counter_sample_from_sample_to_sample = extras.click_counter_sample_from_sample_to_sample !== undefined ? extras.click_counter_sample_from_sample_to_sample : "";
          row.click_counter_roulette_change_during_spin = extras.click_counter_roulette_change_during_spin !== undefined ? extras.click_counter_roulette_change_during_spin : "";
          row.click_counter_sample_during_spin = extras.click_counter_sample_during_spin !== undefined ? extras.click_counter_sample_during_spin : "";
          row.click_counter_spin_during_spin = extras.click_counter_spin_during_spin !== undefined ? extras.click_counter_spin_during_spin : "";
          row.sample_index_within_trial = extras.sample_index_within_trial !== undefined ? extras.sample_index_within_trial : "";
          row.sample_index_total = extras.sample_index_total !== undefined ? extras.sample_index_total : "";
          row.sample_index_loss = extras.sample_index_loss !== undefined ? extras.sample_index_loss : "";
          row.sample_index_gain = extras.sample_index_gain !== undefined ? extras.sample_index_gain : "";
          row.sampled_name = extras.sampled_name !== undefined ? extras.sampled_name : "";
          row.sampled_name_sex = extras.sampled_name_sex !== undefined ? extras.sampled_name_sex : "";
          row.sampled_name_rank = extras.sampled_name_rank !== undefined ? extras.sampled_name_rank : "";
          row.sampled_roulette_outcome = extras.sampled_roulette_outcome !== undefined ? extras.sampled_roulette_outcome : "";
          row.sampled_earnings = extras.sampled_earnings !== undefined ? extras.sampled_earnings : "";
          row.tutorial_order = extras.tutorial_order !== undefined ? extras.tutorial_order : "";
          return this.applyParticipantFieldsToRow(row);
        }

        getNextMainTaskSampleCounters(domain) {
          this.mainTaskSampleIndexTotal += 1;
          this.mainTaskSampleIndexByDomain[domain] = (this.mainTaskSampleIndexByDomain[domain] || 0) + 1;
          return {
            sample_index_total: this.mainTaskSampleIndexTotal,
            sample_index_loss: domain === "loss" ? this.mainTaskSampleIndexByDomain.loss : "",
            sample_index_gain: domain === "gain" ? this.mainTaskSampleIndexByDomain.gain : ""
          };
        }

        fillSectionOutcome(rows, trackerResult) {
          rows.forEach((row) => {
            row.fullscreen_maintained = trackerResult.fullscreen_maintained;
            row.section_time = trackerResult.section_time;
          });
        }

        createPassiveKeyBlocker(onKey) {
          const listener = (event) => {
            if (event.repeat) {
              return;
            }
            if (["Space", "KeyJ", "KeyF", "Digit1"].indexOf(event.code) !== -1) {
              event.preventDefault();
            }
            onKey(event);
          };
          window.addEventListener("keydown", listener, true);
          return () => window.removeEventListener("keydown", listener, true);
        }

        createFirstPostSpinWatcher() {
          const counters = {
            roulette_change: 0,
            sample: 0,
            spin: 0
          };
          let allowSample = false;
          let allowNext = false;
          let spinCounters = null;
          const getSpinCounters = () => Object.assign({}, spinCounters || counters);
          const promise = new Promise((resolve) => {
            this.setKeyHandler((event) => {
              if (event.code === CONFIG.keys.spin.code) {
                counters.spin += 1;
                this.invalidKeypressCount += 1;
                return;
              }
              if (event.code === CONFIG.keys.sample.code) {
                if (allowSample) {
                  this.clearActiveKeyHandler();
                  resolve({
                    type: "sample",
                    keyTime: performance.now(),
                    counters: getSpinCounters()
                  });
                  return;
                }
                counters.sample += 1;
                this.invalidKeypressCount += 1;
                return;
              }
              if (event.code === CONFIG.keys.next.code) {
                if (allowNext) {
                  this.clearActiveKeyHandler();
                  resolve({
                    type: "roulette_change",
                    keyTime: performance.now(),
                    counters: getSpinCounters()
                  });
                  return;
                }
                counters.roulette_change += 1;
                this.invalidKeypressCount += 1;
                return;
              }
              this.invalidKeypressCount += 1;
            });
          });
          return {
            promise: promise,
            markSpinComplete: () => {
              if (!spinCounters) {
                spinCounters = Object.assign({}, counters);
              }
            },
            setAllowed: (options) => {
              if (!spinCounters) {
                spinCounters = Object.assign({}, counters);
              }
              allowSample = Boolean(options && options.sample);
              allowNext = Boolean(options && options.next);
            }
          };
        }

        updateActionStrip(items) {
          const actionStrip = this.query("#action-strip");
          if (!actionStrip) {
            return;
          }
          actionStrip.innerHTML = items.map((item) => {
            const classes = ["action-box"];
            if (item.ready) {
              classes.push("ready");
            }
            if (item.muted) {
              classes.push("muted");
            }
            return '<div class="' + classes.join(" ") + '" style="--fill-progress:' + (item.progress || 0) + ';">' + escapeHtml(item.label) + '</div>';
          }).join("");
        }

        buildTaskLayout(options) {
          return (
            '<div class="task-screen">' +
              (options.pageTitle ? '<div class="task-page-title' + (options.pageTitleClass ? " " + escapeHtml(options.pageTitleClass) : "") + '">' + escapeHtml(options.pageTitle) + '</div>' : "") +
              (options.sideWarning ? (
                '<div class="task-top-warning">' +
                  '<span class="task-top-warning-icon" aria-hidden="true">&#9888;</span>' +
                  '<p class="task-top-warning-text">' + escapeHtml(options.sideWarning) + '</p>' +
                '</div>'
              ) : "") +
              (options.showTutorialPanel ? (
                '<aside class="task-left-panel">' +
                  '<h2 class="task-left-panel-title">Tutorial Instructions</h2>' +

                '</aside>'
              ) : "") +
              '<section class="wheel-zone">' +
                '<div class="wheel-display-row">' +
                  '<div class="corner-display left">' +
                    '<div class="corner-label">Endowment</div>' +
                    '<div class="corner-value" id="starting-amount-display"></div>' +
                  '</div>' +
                  '<div class="corner-display right">' +
                    '<div class="corner-label">Roulette outcome</div>' +
                    '<div class="corner-value" id="roulette-outcome-display"></div>' +
                  '</div>' +
                '</div>' +
                '<div class="wheel-wrapper">' +
                  '<canvas class="wheel-canvas" id="roulette-canvas" width="420" height="420"></canvas>' +
                  '<div class="wheel-pointer"></div>' +
                '</div>' +
              '</section>' +
              '<aside class="sampling-panel">' +
                '<div class="sampling-controls">' +
                  '<div class="mini-control active" id="sampling-control-j">J = See participants\' outcomes</div>' +
                '</div>' +
                '<div class="sampling-list" id="sampling-list"></div>' +
                '<div class="sampling-controls">' +
                  '<div class="mini-control active" id="sampling-control-f">F = Next roulette</div>' +
                '</div>' +
              '</aside>' +
              '<div class="action-strip" id="action-strip"></div>' +
              '<div class="white-flash-overlay" id="white-flash-overlay"></div>' +

          );
        }

        setOutcomeDisplay(value, spinning) {
          const element = this.query("#roulette-outcome-display");
          if (!element) {
            return;
          }
          if (spinning === true) {
            element.innerHTML = createDotsMarkup(true);
            return;
          }
          if (value === "__dots__") {
            element.innerHTML = createDotsMarkup(false);
            return;
          }
          element.textContent = formatCurrency(value);
        }

        setStartingAmountDisplay(domain) {
          const element = this.query("#starting-amount-display");
          if (!element) {
            return;
          }
          element.textContent = formatCurrency(CONFIG.condition_definitions.starting_amounts[domain], { kind: "start" });
        }

        renderSamplingList(lines) {
          const list = this.query("#sampling-list");
          if (!list) {
            return;
          }
          const visible = lines.slice(-CONFIG.sampling_visible_capacity);
          const filled = visible.concat(Array.from({ length: Math.max(0, CONFIG.sampling_visible_capacity - visible.length) }, () => ""));
          list.innerHTML = filled.map((line) => {
            return '<div class="sample-line' + (line ? "" : " empty") + '">' + (line ? escapeHtml(line) : "&nbsp;") + "</div>";
          }).join("");
        }

        setSamplingControlState(options) {
          const controlJ = this.query("#sampling-control-j");
          const controlF = this.query("#sampling-control-f");
          if (controlJ) {
            controlJ.textContent = options.jText || "J = See participants' outcomes";
            controlJ.classList.toggle("cooldown", Boolean(options.jCooldown));
            controlJ.classList.toggle("ready", Boolean(options.jReady));
            setFillProgress(controlJ, options.jProgress || 0);
          }
          if (controlF) {
            controlF.textContent = options.fText || "F = Next roulette";
            controlF.classList.toggle("ready", Boolean(options.fReady));
            setFillProgress(controlF, 0);
          }
        }

        createWheelModel(trialContext) {
          const palette = CONFIG.colors.roulette_red_black_rgb;
          const outcomes = shuffleWithRng(trialContext.outcomes, this.rng);
          const firstOutcome = outcomes[0];
          const secondOutcome = outcomes[1];
          const blackAssignedToFirst = this.rng() < 0.5;
          const blackOutcome = blackAssignedToFirst ? firstOutcome : secondOutcome;
          const redOutcome = blackAssignedToFirst ? secondOutcome : firstOutcome;
          const blackColor = rgbToCss(palette.black);
          const redColor = rgbToCss(palette.red);
          const startWithBlack = this.rng() < 0.5;
          const repeatedSlices = [];
          for (let i = 0; i < 6; i += 1) {
            const useBlack = startWithBlack ? i % 2 === 0 : i % 2 === 1;
            repeatedSlices.push({
              outcome: useBlack ? blackOutcome : redOutcome,
              color: useBlack ? blackColor : redColor
            });
          }
          return {
            black_outcome: blackOutcome,
            red_outcome: redOutcome,
            start_with_black: startWithBlack,
            slices: repeatedSlices,
            outcomes: [firstOutcome, secondOutcome]
          };
        }

        createAttentionWheelModel(outcomes, visualSpec) {
          const normalizedOutcomes = normalizeOutcomePair(outcomes);
          const palette = CONFIG.colors.roulette_red_black_rgb;
          const lowerOutcome = normalizedOutcomes[0];
          const higherOutcome = normalizedOutcomes[1];
          const blackMatchesHigher = visualSpec.roulette_black === Math.max(visualSpec.received_outcome, visualSpec.not_received_outcome);
          const blackOutcome = blackMatchesHigher ? higherOutcome : lowerOutcome;
          const redOutcome = blackMatchesHigher ? lowerOutcome : higherOutcome;
          const blackColor = rgbToCss(palette.black);
          const redColor = rgbToCss(palette.red);
          const slices = [];
          for (let index = 0; index < 6; index += 1) {
            const useBlack = visualSpec.start_with_black ? index % 2 === 0 : index % 2 === 1;
            slices.push({
              outcome: useBlack ? blackOutcome : redOutcome,
              color: useBlack ? blackColor : redColor
            });
          }
          return {
            black_outcome: blackOutcome,
            red_outcome: redOutcome,
            start_with_black: visualSpec.start_with_black,
            slices: slices,
            outcomes: normalizedOutcomes
          };
        }

        ensureWheelRenderCache(wheelModel, width, height) {
          if (
            wheelModel._renderCacheCanvas &&
            wheelModel._renderCacheCanvas.width === width &&
            wheelModel._renderCacheCanvas.height === height
          ) {
            return wheelModel._renderCacheCanvas;
          }
          const cacheCanvas = document.createElement("canvas");
          cacheCanvas.width = width;
          cacheCanvas.height = height;
          const cacheCtx = cacheCanvas.getContext("2d");
          this.paintWheelFrame(cacheCtx, wheelModel, width, height, 0);
          wheelModel._renderCacheCanvas = cacheCanvas;
          return cacheCanvas;
        }

        paintWheelFrame(ctx, wheelModel, width, height, wheelAngle) {
          const cx = width / 2;
          const cy = height / 2;
          const radius = Math.min(width, height) * 0.457;
          const centerCap = radius * 0.219;
          const sliceAngle = (Math.PI * 2) / wheelModel.slices.length;
          ctx.clearRect(0, 0, width, height);

          for (let index = 0; index < wheelModel.slices.length; index += 1) {
            const slice = wheelModel.slices[index];
            const startAngle = wheelAngle + (index * sliceAngle) - (Math.PI / 2) - (sliceAngle / 2);
            const endAngle = startAngle + sliceAngle;

            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, radius, startAngle, endAngle, false);
            ctx.closePath();
            ctx.fillStyle = slice.color;
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = "rgba(255,255,255,0.90)";
            ctx.stroke();

            const midAngle = startAngle + (sliceAngle / 2);
            const label = formatCurrency(slice.outcome);
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(midAngle);
            ctx.textAlign = "left";
            ctx.textBaseline = "middle";
            ctx.fillStyle = "#ffffff";
            ctx.strokeStyle = "rgba(21, 28, 40, 0.26)";
            let fontSize = Math.round(width * 0.067);
            let maxWidth = radius - centerCap - (width * 0.076);
            do {
              ctx.font = "800 " + fontSize + 'px "Trebuchet MS", "Segoe UI", sans-serif';
              if (ctx.measureText(label).width <= maxWidth || fontSize <= Math.round(width * 0.045)) {
                break;
              }
              fontSize -= 1;
            } while (fontSize > Math.round(width * 0.045));
            ctx.lineWidth = Math.max(2, width * 0.0095);
            ctx.strokeText(label, centerCap + (width * 0.043), 0);
            ctx.fillText(label, centerCap + (width * 0.043), 0);
            ctx.restore();
          }

          const ringGradient = ctx.createRadialGradient(cx, cy, radius * 0.24, cx, cy, radius);
          ringGradient.addColorStop(0, "rgba(255,255,255,0)");
          ringGradient.addColorStop(1, "rgba(255,255,255,0.18)");
          ctx.beginPath();
          ctx.arc(cx, cy, radius, 0, Math.PI * 2);
          ctx.fillStyle = ringGradient;
          ctx.fill();

          ctx.beginPath();
          ctx.arc(cx, cy, radius, 0, Math.PI * 2);
          ctx.lineWidth = Math.max(3, width * 0.014);
          ctx.strokeStyle = "#ffffff";
          ctx.stroke();

          const centerGradient = ctx.createLinearGradient(cx, cy - centerCap, cx, cy + centerCap);
          centerGradient.addColorStop(0, "#fefefe");
          centerGradient.addColorStop(1, "#dfe6f3");
          ctx.beginPath();
          ctx.arc(cx, cy, centerCap, 0, Math.PI * 2);
          ctx.fillStyle = centerGradient;
          ctx.fill();
          ctx.lineWidth = Math.max(2, width * 0.007);
          ctx.strokeStyle = "#b6c1d6";
          ctx.stroke();
        }

        drawWheel(canvas, wheelModel, wheelAngle) {
          const ctx = canvas.getContext("2d");
          const width = canvas.width;
          const height = canvas.height;
          const cx = width / 2;
          const cy = height / 2;
          const cachedWheel = this.ensureWheelRenderCache(wheelModel, width, height);
          ctx.clearRect(0, 0, width, height);
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(wheelAngle);
          ctx.drawImage(cachedWheel, -cx, -cy, width, height);
          ctx.restore();
        }

        async animateSpin(canvas, wheelModel, targetIndex) {
          const sliceAngle = (Math.PI * 2) / wheelModel.slices.length;
          const targetBaseAngle = -targetIndex * sliceAngle;
          let delta = ((targetBaseAngle - this.currentWheelAngle + Math.PI) % (Math.PI * 2)) - Math.PI;
          if (delta > 0) {
            delta -= Math.PI * 2;
          }
          const finalAngle = this.currentWheelAngle - (CONFIG.animation.spin_full_turns * Math.PI * 2) + delta;
          const startAngle = this.currentWheelAngle;
          const startTime = performance.now();
          const duration = CONFIG.timings.spin_duration_ms;
          this.setOutcomeDisplay("__dots__", true);
          return new Promise((resolve) => {
            const frame = (now) => {
              const progress = clamp((now - startTime) / duration, 0, 1);
              const eased = easingEaseOutCubic(progress);
              const currentAngle = startAngle + ((finalAngle - startAngle) * eased);
              this.drawWheel(canvas, wheelModel, currentAngle);
              if (progress < 1) {
                window.requestAnimationFrame(frame);
              } else {
                this.currentWheelAngle = finalAngle;
                resolve();
              }
            };
            window.requestAnimationFrame(frame);
          });
        }

        async playWhiteFlash(countedCode) {
          const overlay = this.query("#white-flash-overlay");
          if (!overlay) {
            throw new Error("White flash overlay is missing.");
          }
          let countedPresses = 0;
          this.setKeyHandler((event) => {
            if (countedCode && event.code === countedCode) {
              countedPresses += 1;
              this.invalidKeypressCount += 1;
              return;
            }
            this.invalidKeypressCount += 1;
          });
          overlay.classList.remove("active");
          await nextFrame();
          overlay.classList.add("active");
          await sleep(CONFIG.timings.roulette_change_flash_ms);
          overlay.classList.remove("active");
          this.clearActiveKeyHandler();
          await nextFrame();
          if (overlay.classList.contains("active")) {
            throw new Error("White flash overlay failed to clear.");
          }
          return countedPresses;
        }

        chooseRouletteOutcome(wheelModel) {
          const selectedOutcome = this.rng() < 0.5 ? wheelModel.outcomes[0] : wheelModel.outcomes[1];
          const matchingIndices = [];
          wheelModel.slices.forEach((slice, index) => {
            if (slice.outcome === selectedOutcome) {
              matchingIndices.push(index);
            }
          });
          const targetIndex = pickWithRng(matchingIndices, this.rng);
          const otherOutcome = wheelModel.outcomes[0] === selectedOutcome ? wheelModel.outcomes[1] : wheelModel.outcomes[0];
          return { selectedOutcome: selectedOutcome, otherOutcome: otherOutcome, targetIndex: targetIndex };
        }

        sampleOtherParticipant(trialContext, trialUsedNames) {
          if (!Array.isArray(trialContext._trialAvailableNames) || !trialContext._trialAvailableNames.length) {
            trialContext._trialAvailableNames = shuffleWithRng(CONFIG.nicknames.slice(), this.rng);
            if (trialUsedNames && typeof trialUsedNames.clear === "function") {
              trialUsedNames.clear();
            }
          }
          const name = trialContext._trialAvailableNames.pop();
          if (trialUsedNames) {
            trialUsedNames.add(name);
          }
          const sampledRouletteOutcome = pickWithRng(trialContext.outcomes, this.rng);
          return {
            sampled_name: name,
            sampled_name_sex: CONFIG.nickname_genders[name] === 1 ? "Male" : "Female",
            sampled_name_rank: CONFIG.nickname_ranks[name],
            sampled_roulette_outcome: sampledRouletteOutcome,
            sampled_earnings: trialContext.starting_amount + sampledRouletteOutcome,
            display_line: name + ": " + formatCurrency(sampledRouletteOutcome)
          };
        }

        async showProgressiveInstructionPage(options) {
          this.currentSectionType = options.sectionType;
          const tracker = options.sharedSectionTracker || createSectionTracker(options.sectionType);
          this.render(
            '<div class="screen">' +
              '<div class="instruction-panel">' +
                '<h1 class="instruction-panel-title">' + escapeHtml(options.title) + '</h1>' +
                '<div class="instruction-panel-body' + (options.scrollable ? " scrollable" : " no-scroll") + '" id="instruction-body"></div>' +
                '<div class="inline-validation" id="instruction-message"></div>' +
                '<div class="instruction-bottom">' +
                  '<button class="fill-button" id="instruction-button">Next</button>' +
                '</div>' +
              '</div>' +
            '</div>'
          );

          const body = this.query("#instruction-body");
          const button = this.query("#instruction-button");
          const message = this.query("#instruction-message");
          let revealedCount = options.startFullyRevealed ? options.blocks.length : 1;
          let advanceGateTriggered = !options.requireInitialAdvance;
          let allRevealedAt = (revealedCount >= options.blocks.length && advanceGateTriggered) ? performance.now() : null;
          let active = true;
          let consentChecked = false;
          let declineChecked = false;
          let consentInput = null;
          let declineInput = null;

          const renderBlocks = () => {
            body.innerHTML = "";
            options.blocks.slice(0, revealedCount).forEach((block, index) => {
              const isLatest = index === revealedCount - 1;
              const fadePreviousBlocks = !options.keepRevealedBlocksFullOpacity;
              let blockHtml = '<div class="instruction-block' + ((isLatest || !fadePreviousBlocks) ? "" : " old") + '">';
              if (block.section_title) {
                blockHtml += '<h2 class="instruction-section-title">' + formatInstructionMarkup(block.section_title) + '</h2>';
              }
              block.paragraphs.forEach((paragraph) => {
                blockHtml += '<p class="instruction-paragraph">' + formatInstructionMarkup(paragraph) + '</p>';
              });
              if (block.checkbox_label && revealedCount === options.blocks.length) {
                blockHtml +=
                  '<label class="consent-row">' +
                    '<input type="checkbox" id="consent-checkbox">' +
                    '<span class="consent-label">' + escapeHtml(block.checkbox_label) + '</span>' +
                  '</label>';
                if (block.decline_checkbox_label_html) {
                  blockHtml +=
                    '<label class="consent-row">' +
                      '<input type="checkbox" id="decline-consent-checkbox">' +
                      '<span class="consent-label">' + block.decline_checkbox_label_html + '</span>' +
                    '</label>';
                }
              }
              blockHtml += "</div>";
              body.insertAdjacentHTML("beforeend", blockHtml);
            });
            consentInput = this.query("#consent-checkbox");
            declineInput = this.query("#decline-consent-checkbox");
            if (consentInput) {
              consentInput.checked = consentChecked;
              consentInput.addEventListener("change", () => {
                consentChecked = consentInput.checked;
                if (consentChecked) {
                  declineChecked = false;
                  if (declineInput) {
                    declineInput.checked = false;
                  }
                }
              });
            }
            if (declineInput) {
              declineInput.checked = declineChecked;
              declineInput.addEventListener("change", () => {
                declineChecked = declineInput.checked;
                if (declineChecked) {
                  consentChecked = false;
                  if (consentInput) {
                    consentInput.checked = false;
                  }
                }
              });
            }
            if (options.initialScrollPosition === "top") {
              body.scrollTop = 0;
            } else {
              body.scrollTop = body.scrollHeight;
            }
          };

          const getWaitElapsed = () => {
            if (options.requireInitialAdvance && !advanceGateTriggered) {
              return 0;
            }
            if (options.minViewStartsAfterAllRevealed) {
              if (revealedCount < options.blocks.length || allRevealedAt === null) {
                return 0;
              }
              return performance.now() - allRevealedAt;
            }
            return performance.now() - tracker.startTime;
          };

          const isReadyForNextPage = () => {
            const elapsed = getWaitElapsed();
            const timerDone = elapsed >= options.minViewMs;
            const consentDone = options.requireConsent ? Boolean(consentChecked || declineChecked) : true;
            return revealedCount >= options.blocks.length && advanceGateTriggered && timerDone && consentDone;
          };

          const updateButton = () => {
            if (!active) {
              return;
            }
            if ((options.requireInitialAdvance && !advanceGateTriggered) || revealedCount < options.blocks.length) {
              button.textContent = "Next";
              button.classList.remove("ready");
              setFillProgress(button, 0);
            } else {
              button.textContent = "Next Page";
              const progress = options.minViewMs
                ? clamp(getWaitElapsed() / options.minViewMs, 0, 1)
                : 1;
              setFillProgress(button, progress);
              button.classList.toggle("ready", isReadyForNextPage());
            }
            window.requestAnimationFrame(updateButton);
          };

          renderBlocks();
          window.requestAnimationFrame(updateButton);

          return new Promise((resolve) => {
            button.addEventListener("click", () => {
              if (options.requireInitialAdvance && !advanceGateTriggered) {
                advanceGateTriggered = true;
                if (revealedCount >= options.blocks.length && allRevealedAt === null) {
                  allRevealedAt = performance.now();
                }
                message.textContent = "";
                return;
              }
              if (revealedCount < options.blocks.length) {
                revealedCount += 1;
                if (revealedCount >= options.blocks.length && allRevealedAt === null) {
                  allRevealedAt = performance.now();
                }
                renderBlocks();
                message.textContent = "";
                return;
              }
              if (!isReadyForNextPage()) {
                if (options.requireConsent && !(consentChecked || declineChecked)) {
                  message.textContent = "Please indicate whether you consent or don't consent before continuing.";
                } else {
                  message.textContent = "";
                }
                return;
              }
              active = false;
              const trackerResult = options.deferSectionTrackerEnd
                ? {
                    fullscreen_maintained: tracker.fullscreenMaintained,
                    section_time: 0
                  }
                : tracker.end();
              const extras = options.sectionType === "informed_consent" ? { consent_check: Boolean(consentChecked) } : {};
              const row = this.makeSectionRow(options.sectionType, trackerResult, extras);
              if (options.sectionType === "informed_consent") {
                resolve({ row: row, declined: Boolean(declineChecked) });
                return;
              }
              resolve(row);
            });
          });
        }

        async runComprehensionCheck() {
          this.currentSectionType = "comprehension_questions";
          const tracker = createSectionTracker("comprehension_questions");
          await this.showButtonGatePage({
            title: "Comprehension questions",
            paragraphs: ["Before starting the Roulette Game, please answer the following questions to confirm that you understood how the Roulette Game works."],
            buttonLabel: "Next"
          });
          const questionErrorsById = {};
          const fixedQuestions = CONFIG.question_bank;
          const rows = [];
          const pendingTrackerResult = {
            fullscreen_maintained: Boolean(document.fullscreenElement),
            section_time: 0
          };
          let failedAttempts = 0;

          while (true) {
            const attemptRows = [];
            let failed = false;

            for (let index = 0; index < fixedQuestions.length; index += 1) {
              const result = await this.showQuestionPage(fixedQuestions[index]);
              if (!result.question_answer_correct) {
                questionErrorsById[result.question_id] = (questionErrorsById[result.question_id] || 0) + 1;
                failed = true;
              }
              attemptRows.push(this.makeComprehensionRow(
                result,
                questionErrorsById[result.question_id] || 0,
                pendingTrackerResult
              ));
              if (failed) {
                break;
              }
            }
            this.pushRows(attemptRows);
            rows.push.apply(rows, attemptRows);

            if (!failed) {
              this.fillSectionOutcome(rows, tracker.end());
              return {
                rows: rows,
                excluded: false
              };
            }

            failedAttempts += 1;
            if (failedAttempts >= 2) {
              this.fillSectionOutcome(rows, tracker.end());
              return {
                rows: rows,
                excluded: true
              };
            }

            await this.showComprehensionFailurePage();
            this.pushRows(await this.showTaskInstructionsSequence({
              minViewMs: 0,
              startFullyRevealed: true,
              keepRevealedBlocksFullOpacity: true,
              initialScrollPosition: "top"
            }));
          }
        }

        async showSesQuestionnairePage() {
          this.currentSectionType = "post_experiment_ses";
          const tracker = createSectionTracker("post_experiment_ses");
          const questionText1 = "Think of this ladder as representing where people stand in the United States. At the top of the ladder are the people who are the best off - those who have the most money, the most education, and the most respected jobs. At the bottom are the people who are the worst off - those who have the least money, least education, the least respected jobs, or no job. The higher up you are on this ladder, the closer you are to the people at the very top; the lower you are, the closer you are to the people at the very bottom.";
          const questionText2 = "Where would you place yourself on this ladder?";
          const questionText3 = "Please click the dot next to the rung where you think you stand at this time in your life, relative to other people in the United States.";
          this.render(
            '<div class="screen">' +
              '<div class="ladder-page-shell">' +
                '<div class="ladder-copy">' +
                  '<p class="ladder-question-text">' + escapeHtml(questionText1) + '</p>' +
                  '<p class="ladder-question-text ladder-question-prompt">' + escapeHtml(questionText2) + '</p>' +
                  '<p class="ladder-question-text ladder-question-prompt">' + escapeHtml(questionText3) + '</p>' +
                '</div>' +
                '<div class="ladder-stage">' +
                  '<div class="ladder-widget">' +
                    '<div class="ladder-graphic-slot">' +
                      '<img id="ladder-image" src="' + escapeHtml(CONFIG.study.ladder_image_path) + '" alt="Socioeconomic ladder">' +
                      '<div class="ladder-dots" id="ladder-dot-column"></div>' +
                    '</div>' +
                  '</div>' +
                '</div>' +
                '<div class="ladder-actions">' +
                  '<div class="inline-validation" id="ses-message"></div>' +
                  '<button class="ui-button" id="ses-next">Next</button>' +
                '</div>' +
              '</div>' +
            '</div>'
          );

          const ladderImage = this.query("#ladder-image");
          const dotColumn = this.query("#ladder-dot-column");
          let selectedLevel = "";
          const buildLadderDots = () => {
            if (!ladderImage.complete || !ladderImage.naturalWidth || !ladderImage.naturalHeight) {
              return;
            }
            dotColumn.innerHTML = "";
            const geometry = CONFIG.demographic_options.ses_ladder_geometry;
            const slotRect = dotColumn.getBoundingClientRect();
            const imageRect = ladderImage.getBoundingClientRect();
            const renderedLeft = imageRect.left - slotRect.left;
            const renderedTop = imageRect.top - slotRect.top;
            const renderedWidth = imageRect.width;
            const renderedHeight = imageRect.height;
            const firstPoint = geometry.rung_reference_points[1];
            const lastPoint = geometry.rung_reference_points[10];
            const axisDx = lastPoint.left_x - firstPoint.left_x;
            const axisDy = lastPoint.y - firstPoint.y;
            const axisLength = Math.sqrt((axisDx * axisDx) + (axisDy * axisDy)) || 1;
            const forwardShiftX = (axisDx / axisLength) * geometry.dot_forward_shift_natural_px;
            const forwardShiftY = (axisDy / axisLength) * geometry.dot_forward_shift_natural_px;

            CONFIG.demographic_options.ses_levels.forEach((level) => {
              const rungPoint = geometry.rung_reference_points[level];
              const shiftedRungY = rungPoint.y + forwardShiftY;
              const shiftedLeftEdgeX = rungPoint.left_x + forwardShiftX;
              const renderedRungY = renderedTop + (shiftedRungY / geometry.natural_height) * renderedHeight;
              const renderedLeftEdgeX = renderedLeft + (shiftedLeftEdgeX / geometry.natural_width) * renderedWidth;
              const renderedGapX = (geometry.dot_gap_left_natural_px / geometry.natural_width) * renderedWidth;
              const row = document.createElement("div");
              row.className = "ladder-dot-row";
              row.style.left = (renderedLeftEdgeX - renderedGapX) + "px";
              row.style.top = renderedRungY + "px";
              row.setAttribute("aria-label", "Select ladder level " + level);
              row.innerHTML = '<span class="ladder-dot"></span>';
              row.addEventListener("click", () => {
                selectedLevel = level;
                Array.from(dotColumn.children).forEach((child) => child.classList.remove("selected"));
                row.classList.add("selected");
              });
              dotColumn.appendChild(row);
            });
          };

          ladderImage.addEventListener("load", buildLadderDots);
          ladderImage.addEventListener("error", () => {
            console.warn("Ladder image failed to load:", CONFIG.study.ladder_image_path);
            dotColumn.innerHTML = "";
          });
          if (ladderImage.complete && ladderImage.naturalWidth) {
            buildLadderDots();
          }

          const message = this.query("#ses-message");
          const button = this.query("#ses-next");
          return new Promise((resolve) => {
            button.addEventListener("click", () => {
              if (!selectedLevel) {
                return;
              }
              resolve(this.makeSectionRow("post_experiment_ses", tracker.end(), {
                ses_ladder: selectedLevel,
                experience_description: ""
              }));
            });
          });
        }

              let copied = false;
              if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
                try {
                  await navigator.clipboard.writeText(completionCode);
                  copied = true;

                  copied = false;

                textarea.setAttribute("readonly", "");

                try {

                } catch (error) {
                  copied = false;
                }
                document.body.removeChild(textarea);
              }
              if (copied) {
                copyHint.textContent = "Code copied successfully.";

          APP.shouldRedirectToProlificOnFinish = Boolean(CONFIG.study.collect_persistent_data && !CONFIG.study.cv_review_version);
